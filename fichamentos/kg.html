ia de semi-supervisão (Machine Learning 2020): a citação certa para definir SSL no Cap.2 e para o contraste AL vs SSL (por que escolhemos AL: temos oráculo barato)."}, {"source": "Vaswani2017", "target": "pilar:geral", "type": "pillars"}, {"source": "Vaswani2017", "target": "pilar:P4", "type": "pillars"}, {"source": "Vaswani2017", "target": "conceito:transformer", "type": "proposes"}, {"source": "Vaswani2017", "target": "conceito:self-attention", "type": "proposes"}, {"source": "Vaswani2017", "target": "metodo:atencao", "type": "uses_methods"}, {"source": "Vaswani2017", "target": "metodo:encoder-decoder", "type": "uses_methods"}, {"source": "Vaswani2017", "target": "modelo:transformer", "type": "models"}, {"source": "Vaswani2017", "target": "dataset:wmt14", "type": "datasets"}, {"source": "Vaswani2017", "target": "tarefa:traducao-automatica", "type": "tasks"}, {"source": "Vaswani2017", "target": "FALCO", "type": "fundamenta", "note": "A arquitetura de TUDO que a tese usa: BERTimbau (encoder Transformer) e os próprios LLMs-oráculo (decoders Transformer). Uma citação, duas pontas do FALCO."}, {"source": "Wang2021GPT3Labeling", "target": "pilar:P3", "type": "pillars"}, {"source": "Wang2021GPT3Labeling", "target": "metodo:llm-como-oraculo", "type": "uses_methods"}, {"source": "Wang2021GPT3Labeling", "target": "metodo:few-shot", "type": "uses_methods"}, {"source": "Wang2021GPT3Labeling", "target": "metodo:menor-confianca", "type": "uses_methods"}, {"source": "Wang2021GPT3Labeling", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Wang2021GPT3Labeling", "target": "metodo:fine-tuning", "type": "uses_methods"}, {"source": "Wang2021GPT3Labeling", "target": "modelo:gpt-3-davinci", "type": "models"}, {"source": "Wang2021GPT3Labeling", "target": "modelo:roberta-large", "type": "models"}, {"source": "Wang2021GPT3Labeling", "target": "modelo:pegasus-large", "type": "models"}, {"source": "Wang2021GPT3Labeling", "target": "dataset:agnews", "type": "datasets"}, {"source": "Wang2021GPT3Labeling", "target": "dataset:trec", "type": "datasets"}, {"source": "Wang2021GPT3Labeling", "target": "dataset:dbpedia", "type": "datasets"}, {"source": "Wang2021GPT3Labeling", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Wang2021GPT3Labeling", "target": "FALCO", "type": "fundamenta", "note": "Primeiro trabalho (auto-declarado) a ANALISAR O CUSTO do LLM como rotulador e o mix LLM+humano sob orçamento fixo — é o ancestral direto do eixo custo-por-rótulo do P3. A 'active labeling' deles (humano re-rotula os casos de menor confiança do GPT-3) é o dual do FALCO (LLM anota o que o seletor pede). Fundamenta a moldura de AL como alocação de recursos sob orçamento (ancoragem PPGMNE) e a tabela de custo do Cap. 5."}, {"source": "Wertz2022", "target": "Devlin2019", "type": "builds_on"}, {"source": "Wertz2022", "target": "pilar:P1", "type": "pillars"}, {"source": "Wertz2022", "target": "pilar:P2", "type": "pillars"}, {"source": "Wertz2022", "target": "conceito:limiar-variavel-multirrotulo", "type": "proposes"}, {"source": "Wertz2022", "target": "conceito:cnn-como-cabeca-de-classificacao", "type": "proposes"}, {"source": "Wertz2022", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Wertz2022", "target": "metodo:pool-based", "type": "uses_methods"}, {"source": "Wertz2022", "target": "metodo:alps", "type": "uses_methods"}, {"source": "Wertz2022", "target": "metodo:cvirs", "type": "uses_methods"}, {"source": "Wertz2022", "target": "metodo:discriminative-active-learning", "type": "uses_methods"}, {"source": "Wertz2022", "target": "metodo:amostragem-por-subpalavras", "type": "uses_methods"}, {"source": "Wertz2022", "target": "metodo:selecao-aleatoria", "type": "uses_methods"}, {"source": "Wertz2022", "target": "modelo:bert-base-uncased", "type": "models"}, {"source": "Wertz2022", "target": "dataset:eurlex", "type": "datasets"}, {"source": "Wertz2022", "target": "dataset:arxiv-xmtc", "type": "datasets"}, {"source": "Wertz2022", "target": "dataset:nyt", "type": "datasets"}, {"source": "Wertz2022", "target": "dataset:rcv1", "type": "datasets"}, {"source": "Wertz2022", "target": "dataset:yelp-xmtc", "type": "datasets"}, {"source": "Wertz2022", "target": "dataset:agnews", "type": "datasets"}, {"source": "Wertz2022", "target": "dataset:toxic", "type": "datasets"}, {"source": "Wertz2022", "target": "tarefa:classificacao-multirrotulo-extrema", "type": "tasks"}, {"source": "Wertz2022", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Wertz2022", "target": "FALCO", "type": "ameaca", "note": "É o achado mais incômodo da literatura fichada para a premissa do FALCO: em rótulo extremo, NENHUMA das quatro estratégias testadas (ALPS, CVIRS, DAL, subword) supera a seleção ALEATÓRIA de forma consistente entre conjuntos, e em quatro dos sete a aleatória empata ou ganha (p. 4601, 4604). Com 621 classes o FALCO opera na mesma faixa do EurLex (739) e do Yelp (580) deste artigo. Obriga a tese a tratar o braço aleatório como baseline forte, não como palha, e a declarar em qual regime a seleção compensa."}, {"source": "Wertz2022", "target": "LCE", "type": "fundamenta", "note": "Dá base externa para reportar macro F1 e não só micro: §6.2 (p. 4604) argumenta que micro F1 sobe mesmo quando o classificador só melhora nas classes frequentes, e que em rótulo extremo é o macro que mede quantas classes o sistema aprende a discriminar. É o mesmo motivo pelo qual o Cap. 5 elege macro F1 como métrica principal."}, {"source": "Widodo2022", "target": "FALCO", "type": "fundamenta", "note": "Sustenta a afirmação do Cap. 2 de que a estratificação das dobras é essencial sob desbalanceamento: no estudo, é exatamente o recurso adotado para lidar com classe-alvo desbalanceada."}, {"source": "Wilcoxon1945", "target": "FALCO", "type": "fundamenta", "note": "Teste de postos sinalizados: compara duas estratégias nas mesmas sementes sem supor normalidade — usado nos experimentos E1/E4."}, {"source": "Wilson1927", "target": "FALCO", "type": "fundamenta", "note": "Intervalo de confiança para proporção binomial obtido resolvendo a desigualdade no parâmetro, e não na estimativa — é o IC de 95% usado em TODA acurácia de oráculo relatada na tese."}, {"source": "Wong2015", "target": "pilar:geral", "type": "pillars"}, {"source": "Wong2015", "target": "FALCO", "type": "contextualiza", "note": "Trio de validação: Blum1999 + Fushiki2011 + Wong2015."}, {"source": "Wu2020", "target": "Minaee2022", "type": "compares_with"}, {"source": "Wu2020", "target": "pilar:geral", "type": "pillars"}, {"source": "Wu2020", "target": "metodo:deep-learning", "type": "uses_methods"}, {"source": "Wu2020", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Wu2020", "target": "FALCO", "type": "contextualiza", "note": "Review menor de DL para classificação de texto; nomeia as fraquezas do ML tradicional (explosão de dimensão, esparsidade, generalização limitada) — frase útil para a transição do Cap.2."}, {"source": "Xia2025", "target": "pilar:P3", "type": "pillars"}, {"source": "Xia2025", "target": "Cap2-revisao", "type": "contextualiza", "note": "Survey canônico da área AL+LLM: organiza papéis do LLM no laço (seletor, anotador, gerador). Confirma que os subproblemas (custo, cold start, ruído, parada) seguem tratados separadamente — a INTEGRAÇÃO instrumentada é a lacuna que o FALCO ocupa."}, {"source": "Xia2025CanDist", "target": "pilar:P3", "type": "pillars"}, {"source": "Xia2025CanDist", "target": "conceito:rotulos-candidatos", "type": "proposes"}, {"source": "Xia2025CanDist", "target": "conceito:destilacao-teacher-student", "type": "proposes"}, {"source": "Xia2025CanDist", "target": "modelo:gpt-3.5", "type": "models"}, {"source": "Xia2025CanDist", "target": "modelo:roberta", "type": "models"}, {"source": "Xia2025CanDist", "target": "dataset:TREC", "type": "datasets"}, {"source": "Xia2025CanDist", "target": "dataset:MedicalAbstract", "type": "datasets"}, {"source": "Xia2025CanDist", "target": "dataset:DBpedia", "type": "datasets"}, {"source": "Xia2025CanDist", "target": "dataset:AGNews", "type": "datasets"}, {"source": "Xia2025CanDist", "target": "dataset:RCT", "type": "datasets"}, {"source": "Xia2025CanDist", "target": "dataset:Banking77", "type": "datasets"}, {"source": "Xia2025CanDist", "target": "E0P-invalidos-futuros", "type": "estende", "note": "Correção conceitual importante: quando incerto, o LLM emite CONJUNTO de rótulos candidatos (não um único 'ouro'); um SLM destila. A incerteza do oráculo vira informação em vez de erro duro. Citado nos futuros como resposta aos nossos 2-4% de inválidos e ao erro de fronteira do RQ3. CanDist sem humanos supera baselines com 10% de anotação humana em TREC."}, {"source": "Xiao2023FreeAL", "target": "pilar:P3", "type": "pillars"}, {"source": "Xiao2023FreeAL", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Xiao2023FreeAL", "target": "metodo:llm-como-oraculo", "type": "uses_methods"}, {"source": "Xiao2023FreeAL", "target": "metodo:destilacao-ativa", "type": "uses_methods"}, {"source": "Xiao2023FreeAL", "target": "metodo:few-shot", "type": "uses_methods"}, {"source": "Xiao2023FreeAL", "target": "metodo:zero-shot", "type": "uses_methods"}, {"source": "Xiao2023FreeAL", "target": "metodo:entropia", "type": "uses_methods"}, {"source": "Xiao2023FreeAL", "target": "metodo:cold-start", "type": "uses_methods"}, {"source": "Xiao2023FreeAL", "target": "modelo:gpt-3.5-turbo", "type": "models"}, {"source": "Xiao2023FreeAL", "target": "modelo:roberta-base", "type": "models"}, {"source": "Xiao2023FreeAL", "target": "modelo:biomed-roberta-base", "type": "models"}, {"source": "Xiao2023FreeAL", "target": "dataset:trec", "type": "datasets"}, {"source": "Xiao2023FreeAL", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Xiao2023FreeAL", "target": "FALCO", "type": "compara", "note": "Vizinho direto exigido pelo parecer R6 (Bloco C, item 9 / Dom-M1) ": "metodo:selecao-por-diversidade", "type": "uses_methods"}, {"source": "Yu2023Patron", "target": "modelo:roberta-base", "type": "models"}, {"source": "Yu2023Patron", "target": "modelo:simcse", "type": "models"}, {"source": "Yu2023Patron", "target": "dataset:imdb", "type": "datasets"}, {"source": "Yu2023Patron", "target": "dataset:agnews", "type": "datasets"}, {"source": "Yu2023Patron", "target": "dataset:trec", "type": "datasets"}, {"source": "Yu2023Patron", "target": "dataset:yelp-full", "type": "datasets"}, {"source": "Yu2023Patron", "target": "dataset:yahoo-answers", "type": "datasets"}, {"source": "Yu2023Patron", "target": "dataset:dbpedia", "type": "datasets"}, {"source": "Yu2023Patron", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Yu2023Patron", "target": "DRI-SL", "type": "compara", "note": "Estado da arte de cold start textual que USA o conhecimento do PLM na seleção: pseudo-rótulos por prompt cloze + calibração + entropia, propagados por kernel RBF a vizinhos k-NN (SimCSE), e diversidade via K-Means + reescrita com regularização entre clusters. O DRI-SL difere em três eixos: (i) custo — PATRON roda inferência do PLM em TODO o pool não rotulado; DRI-SL usa encoder congelado + operações esparsas, sem nenhum modelo na malha de seleção; (ii) engenharia — PATRON exige template e verbalizador manuais por tarefa (mapear as 714 classes do varejo a palavras-rótulo de [MASK] é impraticável; experimentos param em c=14); (iii) sinal — PATRON mistura incerteza pseudo-rotulada com diversidade; DRI-SL é 100% representatividade + novidade lexical, coerente com a evidência de que incerteza é enviesada no cold start (o próprio PATRON, §1 e obs. 3 do §5.3)."}, {"source": "Yu2023Patron", "target": "FALCO", "type": "compara", "note": "Como o ActiveLLM (Bayer2024ActiveLLM), põe o modelo de linguagem na fase de SELEÇÃO; o FALCO faz a separação oposta — seleção local barata (DRI-SL) e LLM só na ROTULAGEM — reduzindo chamadas na fase cara e eliminando template/verbalizador por classe."}, {"source": "Yuan2020", "target": "Lewis1994", "type": "builds_on"}, {"source": "Yuan2020", "target": "Devlin2019", "type": "builds_on"}, {"source": "Yuan2020", "target": "pilar:P1", "type": "pillars"}, {"source": "Yuan2020", "target": "conceito:alps", "type": "proposes"}, {"source": "Yuan2020", "target": "conceito:surprisal-embeddings", "type": "proposes"}, {"source": "Yuan2020", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Yuan2020", "target": "metodo:cold-start", "type": "uses_methods"}, {"source": "Yuan2020", "target": "metodo:k-means", "type": "uses_methods"}, {"source": "Yuan2020", "target": "metodo:selecao-por-diversidade", "type": "uses_methods"}, {"source": "Yuan2020", "target": "metodo:rotulagem-em-lote", "type": "uses_methods"}, {"source": "Yuan2020", "target": "metodo:fine-tuning", "type": "uses_methods"}, {"source": "Yuan2020", "target": "modelo:bert-base-uncased", "type": "models"}, {"source": "Yuan2020", "target": "dataset:agnews", "type": "datasets"}, {"source": "Yuan2020", "target": "dataset:imdb", "type": "datasets"}, {"source": "Yuan2020", "target": "dataset:pubmed-20k-rct", "type": "datasets"}, {"source": "Yuan2020", "target": "dataset:sst-2", "type": "datasets"}, {"source": "Yuan2020", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Yuan2020", "target": "DRI-SL", "type": "fundamenta", "note": "É o antecessor conceitual direto da Fase 1 do FALCO: usa conhecimento PRÉ-TREINADO para escolher o lote inicial sem depender de um modelo treinado nos nossos rótulos. A diferença é a fonte do sinal — o ALPS usa a perda de modelagem de linguagem mascarada do próprio BERT; o DRI-SL usa densidade semântica e variedade lexical. Mesma ideia, instrumentos distintos."}, {"source": "Yuan2020", "target": "FALCO", "type": "motiva", "note": "O diagnóstico de abertura é o mesmo da tese: estratégias clássicas de incerteza falham em modelo profundo porque rede neural é mal calibrada, e alta confiança não implica alta correção. É a justificativa externa para o FALCO não depender só de incerteza do classificador."}, {"source": "Yuan2025NoiseAL", "target": "pilar:P3", "type": "pillars"}, {"source": "Yuan2025NoiseAL", "target": "pilar:P4", "type": "pillars"}, {"source": "Yuan2025NoiseAL", "target": "conceito:filtragem-colaborativa-de-ruido", "type": "proposes"}, {"source": "Yuan2025NoiseAL", "target": "conceito:llm-sob-demanda", "type": "proposes"}, {"source": "Yuan2025NoiseAL", "target": "metodo:dois-modelos-pequenos-como-filtro", "type": "uses_methods"}, {"source": "Yuan2025NoiseAL", "target": "metodo:separacao-dinamica-limpo-ruidoso", "type": "uses_methods"}, {"source": "Yuan2025NoiseAL", "target": "dataset:TREC", "type": "datasets"}, {"source": "Yuan2025NoiseAL", "target": "E4-futuros", "type": "estende", "note": "Aciona o LLM anotador SÓ onde a probabilidade de ruído é alta (small models filtram) — contabilidade rara de tokens/custo (25.990 tokens, US$0,39 em TREC 20% simétrico). Citado nos trabalhos futuros como extensão natural do E4: correção colaborativa em vez de descarte."}, {"source": "Zhang2016ShortText", "target": "Song2014", "type": "compares_with"}, {"source": "Zhang2016ShortText", "target": "Song2014", "type": "builds_on"}, {"source": "Zhang2016ShortText", "target": "Mikolov2013", "type": "builds_on"}, {"source": "Zhang2016ShortText", "target": "pilar:geral", "type": "pillars"}, {"source": "Zhang2016ShortText", "target": "conceito:vetores-conjuntos-palavra-topico", "type": "proposes"}, {"source": "Zhang2016ShortText", "target": "metodo:topic-models", "type": "uses_methods"}, {"source": "Zhang2016ShortText", "target": "metodo:embeddings", "type": "uses_methods"}, {"source": "Zhang2016ShortText", "target": "metodo:enriquecimento-com-corpus-externo", "type": "uses_methods"}, {"source": "Zhang2016ShortText", "target": "tarefa:classificacao-de-texto-curto", "type": "tasks"}, {"source": "Zhang2016ShortText", "target": "FALCO", "type": "contextualiza", "note": "Linha de enriquecimento para texto curto (vetores de palavras + tópicos ocultos aprendidos com coleção externa): a resposta pré-LLM à esparsidade. O expanded_description do nosso prompt é o herdeiro dessa linha com conhecimento paramétrico."}, {"source": "Zhang2023LLMaAA", "target": "Wang2021GPT3Labeling", "type": "builds_on"}, {"source": "Zhang2023LLMaAA", "target": "pilar:P2", "type": "pillars"}, {"source": "Zhang2023LLMaAA", "target": "pilar:P3", "type": "pillars"}, {"source": "Zhang2023LLMaAA", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Zhang2023LLMaAA", "target": "metodo:pool-based", "type": "uses_methods"}, {"source": "Zhang2023LLMaAA", "target": "metodo:llm-como-oraculo", "type": "uses_methods"}, {"source": "Zhang2023LLMaAA", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "Zhang2023LLMaAA", "target": "metodo:entropia", "type": "uses_methods"}, {"source": "Zhang2023LLMaAA", "target": "metodo:menor-confianca", "type": "uses_methods"}, {"source": "Zhang2023LLMaAA", "target": "metodo:few-shot", "type": "uses_methods"}, {"source": "Zhang2023LLMaAA", "target": "metodo:saida-estruturada", "type": "uses_methods"}, {"source": "Zhang2023LLMaAA", "target": "metodo:fine-tuning", "type": "uses_methods"}, {"source": "Zhang2023LLMaAA", "target": "modelo:gpt-3.5-turbo", "type": "models"}, {"source": "Zhang2023LLMaAA", "target": "modelo:gpt-3", "type": "models"}, {"source": "Zhang2023LLMaAA", "target": "modelo:gpt-4", "type": "models"}, {"source": "Zhang2023LLMaAA", "target": "modelo:bert", "type": "models"}, {"source": "Zhang2023LLMaAA", "target": "FALCO", "type": "compara", "note": "Vizinho direto exigido pelo parecer R6 (Bloco C, item 9 / Dom-M1): é O paper que põe o LLM como anotador DENTRO do laço pool-based com aquisição por incerteza — a mesma composição estrutural do FALCO. Difere: tarefas NER/RE (não classificação em espaço fechado grande), precisa de 100 exemplos ouro para demonstração+validação, robustez via reponderação automática (meta-learning), e não instrumenta custo monetário por rótulo. Confronto central do Cap. 2 e da RQ de seleção."}, {"source": "Zhang2023LLMaAA", "target": "DRI-SL", "type": "compara", "note": "Compara estratégias de aquisição sob oráculo-LLM: menor confiança e entropia máxima superam aleatório e k-means (diversidade) — evidência externa para o debate incerteza vs representatividade do P2."}, {"source": "Zhang2025", "target": "Settles2009", "type": "builds_on"}, {"source": "Zhang2025", "target": "pilar:P3", "type": "pillars"}, {"source": "Zhang2025", "target": "pilar:P4", "type": "pillars"}, {"source": "Zhang2025", "target": "conceito:llm-como-oraculo", "type": "proposes"}, {"source": "Zhang2025", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Zhang2025", "target": "metodo:pool-based", "type": "uses_methods"}, {"source": "Zhang2025", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "Zhang2025", "target": "metodo:query-by-committee", "type": "uses_methods"}, {"source": "Zhang2025", "target": "metodo:entropia", "type": "uses_methods"}, {"source": "Zhang2025", "target": "metodo:selecao-por-diversidade", "type": "uses_methods"}, {"source": "Zhang2025", "target": "metodo:core-set-selection", "type": "uses_methods"}, {"source": "Zhang2025", "target": "metodo:saida-estruturada", "type": "uses_methods"}, {"source": "Zhang2025", "target": "metodo:rotulagem-em-lote", "type": "uses_methods"}, {"source": "Zhang2025", "target": "modelo:gpt-4o", "type": "models"}, {"source": "Zhang2025", "target": "modelo:roberta-base", "type": "models"}, {"source": "Zhang2025", "target": "modelo:svm", "type": "models"}, {"source": "Zhang2025", "target": "modelo:random-forest", "type": "models"}, {"source": "Zhang2025", "target": "dataset:imdb", "type": "datasets"}, {"source": "Zhang2025", "target": "dataset:agnews", "type": "datasets"}, {"source": "Zhang2025", "target": "dataset:jigsaw-toxic", "type": "datasets"}, {"source": "Zhang2025", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Zhang2025", "target": "FALCO", "type": "compara", "note": "Vizinho mais próximo na frente 'anotador': o LLM substitui o humano dentro do laço de aprendizado ativo, rotulando o que a estratégia de seleção escolheu, e um modelo pequeno é treinado com esses rótulos. O FALCO difere em três pontos: progressão de oráculos entre fases, espaço fechado de 621 rótulos imposto na saída, e gate de parada pré-registrado com instrumentação de custo."}, {"source": "Zhang2025", "target": "LCE", "type": "fundamenta", "note": "Traz a conta que a tese também persegue: reter mais de 93% do desempenho gastando cerca de 6% do tempo e do dinheiro (Resumo, p. 1)."}, {"source": "Zhao2017DeepALShortText", "target": "Lewis1994", "type": "builds_on"}, {"source": "Zhao2017DeepALShortText", "target": "pilar:geral", "type": "pillars"}, {"source": "Zhao2017DeepALShortText", "target": "pilar:P2", "type": "pillars"}, {"source": "Zhao2017DeepALShortText", "target": "metodo:deep-active-learning", "type": "uses_methods"}, {"source": "Zhao2017DeepALShortText", "target": "metodo:cnn", "type": "uses_methods"}, {"source": "Zhao2017DeepALShortText", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "Zhao2017DeepALShortText", "target": "tarefa:classificacao-de-texto-curto", "type": "tasks"}, {"source": "Zhao2017DeepALShortText", "target": "FALCO", "type": "fundamenta", "note": "Precedente direto da COMBINAÇÃO da tese: deep AL aplicado especificamente a texto curto (2017, era CNN). Mostra que a interseção já era reconhecida como problema próprio antes dos transformers — o FALCO a revisita com BERTimbau e oráculo LLM."}, {"source": "Zulqarnain2020", "target": "pilar:geral", "type": "pillars"}, {"source": "Zulqarnain2020", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Zulqarnain2020", "target": "FALCO", "type": "contextualiza", "note": "Review pré-transformer herdado; superado por Minaee2022."}, {"source": "zhang-etal-2022-survey", "target": "Settles2012", "type": "builds_on"}, {"source": "zhang-etal-2022-survey", "target": "Ren2021", "type": "builds_on"}, {"source": "zhang-etal-2022-survey", "target": "Lewis1994", "type": "builds_on"}, {"source": "zhang-etal-2022-survey", "target": "Cohn1994Improving", "type": "builds_on"}, {"source": "zhang-etal-2022-survey", "target": "pilar:geral", "type": "pillars"}, {"source": "zhang-etal-2022-survey", "target": "pilar:P2", "type": "pillars"}, {"source": "zhang-etal-2022-survey", "target": "pilar:P4", "type": "pillars"}, {"source": "zhang-etal-2022-survey", "target": "conceito:taxonomia-de-estrategias-de-consulta", "type": "proposes"}, {"source": "zhang-etal-2022-survey", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "zhang-etal-2022-survey", "target": "metodo:representatividade", "type": "uses_methods"}, {"source": "zhang-etal-2022-survey", "target": "metodo:cold-start", "type": "uses_methods"}, {"source": "zhang-etal-2022-survey", "target": "metodo:criterio-de-parada", "type": "uses_methods"}, {"source": "zhang-etal-2022-survey", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "zhang-etal-2022-survey", "target": "tarefa:predicao-estruturada", "type": "tasks"}, {"source": "zhang-etal-2022-survey", "target": "FALCO", "type": "fundamenta", "note": "Survey-espinha-dorsal do Cap.2: organiza estratégias de consulta (informatividade vs representatividade), cold-start e parada — exatamente os eixos das fases do FALCO. Anterior à era dos LLMs-como-oráculo, o que demarca a lacuna que a tese ocupa."}]};

const TYPE_LABEL = {
  "artigo": "Artigos fichados", "artigo-pendente": "A fichar", "framework": "FALCO",
  "tema-falco": "Temas do FALCO", "pilar": "Pilares", "metodo": "Métodos",
  "conceito": "Conceitos propostos", "modelo": "Modelos", "dataset": "Datasets",
  "tarefa": "Tarefas"
};
const TYPE_VAR = {
  "artigo": "--artigo", "artigo-pendente": "--pendente", "framework": "--framework",
  "tema-falco": "--tema-falco", "pilar": "--pilar", "metodo": "--metodo",
  "conceito": "--conceito", "modelo": "--modelo", "dataset": "--dataset",
  "tarefa": "--tarefa"
};
const RADIUS = { "framework": 16, "artigo": 9, "artigo-pendente": 6, "pilar": 11, "tema-falco": 10 };
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const nodes = GRAPH.nodes.map(n => ({ ...n,
  x: Math.random() * 800 - 400, y: Math.random() * 600 - 300, vx: 0, vy: 0,
  r: RADIUS[n.type] || 7 }));
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
const edges = GRAPH.edges.filter(e => byId[e.source] && byId[e.target])
  .map(e => ({ ...e, s: byId[e.source], t: byId[e.target] }));
const degree = {};
edges.forEach(e => { degree[e.source] = (degree[e.source]||0)+1; degree[e.target] = (degree[e.target]||0)+1; });
nodes.forEach(n => { if (n.type === "artigo") n.r = 8 + Math.min(6, (degree[n.id]||0) * 0.35); });

const visible = {}; Object.keys(TYPE_LABEL).forEach(t => visible[t] = true);
["modelo","dataset","tarefa"].forEach(t => visible[t] = false); // começa focado

const filters = document.getElementById("filters");
const present = new Set(nodes.map(n => n.type));
for (const t of Object.keys(TYPE_LABEL)) {
  if (!present.has(t)) continue;
  const label = document.createElement("label");
  const cb = Object.assign(document.createElement("input"), { type: "checkbox", checked: visible[t] });
  cb.addEventListener("change", () => { visible[t] = cb.checked; });
  const sw = document.createElement("span"); sw.className = "swatch";
  sw.style.background = css(TYPE_VAR[t]);
  label.append(cb, sw, TYPE_LABEL[t]);
  filters.append(label);
}
document.getElementById("stats").textContent =
  `${nodes.filter(n=>n.type==="artigo").length} artigos · ${edges.length} relações`;

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W, H, DPR = Math.min(2, window.devicePixelRatio || 1);
let scale = 1, ox = 0, oy = 0;
function resize() {
  const rect = cv.parentElement.getBoundingClientRect();
  W = rect.width; H = rect.height;
  cv.width = W * DPR; cv.height = H * DPR;
  ox = ox || W / 2; oy = oy || H / 2;
}
window.addEventListener("resize", resize); resize();

function isVisible(n) { return visible[n.type]; }

const VMAX = 30; // teto de velocidade: mantém o layout numericamente estável
function step() {
  const vs = nodes.filter(isVisible);
  for (const n of vs) { n.vx *= 0.85; n.vy *= 0.85; }
  for (let i = 0; i < vs.length; i++) for (let j = i + 1; j < vs.length; j++) {
    const a = vs[i], b = vs[j];
    let dx = b.x - a.x, dy = b.y - a.y, d2 = dx*dx + dy*dy;
    if (d2 < 90000) {
      d2 = Math.max(d2, 25);              // piso: evita força explosiva (nós colados)
      const f = Math.min(1400 / d2, 40);  // teto de força de repulsão
      const d = Math.sqrt(d2);
      dx /= d; dy /= d;
      a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
    }
  }
  for (const e of edges) {
    if (!isVisible(e.s) || !isVisible(e.t)) continue;
    let dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1, want = e.t.type === "framework" || e.s.type === "framework" ? 190 : 120;
    const f = (d - want) * 0.004; dx /= d; dy /= d;
    e.s.vx += dx * f * d * 0.02; e.s.vy += dy * f * d * 0.02;
    e.t.vx -= dx * f * d * 0.02; e.t.vy -= dy * f * d * 0.02;
  }
  for (const n of vs) {
    n.vx -= n.x * 0.0012; n.vy -= n.y * 0.0012; // gravidade ao centro
    n.vx = Math.max(-VMAX, Math.min(VMAX, n.vx));
    n.vy = Math.max(-VMAX, Math.min(VMAX, n.vy));
    if (n !== dragNode) { n.x += n.vx; n.y += n.vy; }
  }
}

let selected = null, hover = null, focusSet = null;
function setFocus(n) {
  selected = n;
  if (!n) { focusSet = null; return; }
  focusSet = new Set([n]);
  for (const e of edges) {
    if (e.s === n) focusSet.add(e.t);
    else if (e.t === n) focusSet.add(e.s);
  }
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.translate(ox, oy); ctx.scale(scale, scale);
  const edgeCol = css("--edge"), falcoCol = css("--edge-falco");
  for (const e of edges) {
    if (!isVisible(e.s) || !isVisible(e.t)) continue;
    const inFocus = e.s === selected || e.t === selected;
    ctx.globalAlpha = (!focusSet || inFocus) ? 1 : 0.06;
    const toFalco = e.t.type === "framework";
    ctx.strokeStyle = toFalco ? falcoCol : edgeCol;
    ctx.lineWidth = inFocus ? 2.2 : (toFalco ? 1.4 : 0.8);
    ctx.beginPath(); ctx.moveTo(e.s.x, e.s.y); ctx.lineTo(e.t.x, e.t.y); ctx.stroke();
  }
  for (const n of nodes) {
    if (!isVisible(n)) continue;
    const dimmed = focusSet && !focusSet.has(n);
    ctx.globalAlpha = dimmed ? 0.12 : 1;
    const col = css(TYPE_VAR[n.type] || "--muted");
    if (n === selected || n === hover) {
      ctx.fillStyle = css("--halo");
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 8, 0, 7); ctx.fill();
    }
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.fill();
    if (n.type === "artigo-pendente") {
      ctx.strokeStyle = css("--bg"); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r - 2, 0, 7); ctx.stroke();
    }
    if (!dimmed && (scale > 0.55 || n.r >= 11 || n === selected || n === hover
        || (focusSet && focusSet.has(n)))) {
      ctx.fillStyle = css("--ink");
      ctx.font = `${n.type === "framework" ? "700 13px Georgia, serif" : "11px system-ui"}`;
      ctx.textAlign = "center";
      ctx.fillText(n.label, n.x, n.y - n.r - 5);
    }
  }
  ctx.globalAlpha = 1;
}

function loop() { step(); draw(); requestAnimationFrame(loop); }

function pick(mx, my) {
  const x = (mx - ox) / scale, y = (my - oy) / scale;
  let best = null, bestD = 1e9;
  for (const n of nodes) {
    if (!isVisible(n)) continue;
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < n.r + 6 && d < bestD) { best = n; bestD = d; }
  }
  return best;
}

let dragNode = null, panning = false, px = 0, py = 0, moved = false;
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId); moved = false;
  const n = pick(e.offsetX, e.offsetY);
  if (n) { dragNode = n; cv.classList.add("dragging"); }
  else { panning = true; px = e.offsetX; py = e.offsetY; }
});
cv.addEventListener("pointermove", e => {
  if (dragNode) {
    moved = true;
    dragNode.x = (e.offsetX - ox) / scale; dragNode.y = (e.offsetY - oy) / scale;
    dragNode.vx = dragNode.vy = 0;
  } else if (panning) {
    moved = true; ox += e.offsetX - px; oy += e.offsetY - py; px = e.offsetX; py = e.offsetY;
  } else hover = pick(e.offsetX, e.offsetY);
});
cv.addEventListener("pointerup", e => {
  if (!moved) {
    const n = pick(e.offsetX, e.offsetY);
    setFocus(n); showDetail(n);
  }
  dragNode = null; panning = false; cv.classList.remove("dragging");
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.12 : 0.89, ns = Math.min(4, Math.max(0.25, scale * k));
  ox = e.offsetX - (e.offsetX - ox) * (ns / scale);
  oy = e.offsetY - (e.offsetY - oy) * (ns / scale);
  scale = ns;
}, { passive: false });

const detail = document.getElementById("detail"), body = document.getElementById("detail-body");
document.getElementById("close").addEventListener("click", () => { detail.classList.remove("open"); setFocus(null); });
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// Em modo hospedado (demo público) os PDFs não são distribuídos (direitos
// autorais): o botão de PDF some e só o link do publicador fica.
const HOSTED = (typeof window !== "undefined") && window.KG_HOSTED === true;
// PDF só para visualização: sem download, com o toolbar do visualizador oculto.
// Servido pelo backend (/api/fichamentos/{id}/pdf) ou, se aberto como arquivo
// local, relativo à pasta da tese.
function pdfSrc(n) {
  if (!n.pdf) return null;
  const frag = "#toolbar=0&navpanes=0&scrollbar=0";
  if (location.protocol === "file:") return "../" + n.pdf + frag;
  return "/api/fichamentos/" + encodeURIComponent(n.id) + "/pdf" + frag;
}
// carrega o iframe do PDF só ao clicar (evita baixar todo PDF a cada seleção)
body.addEventListener("click", ev => {
  const btn = ev.target.closest(".pdf-open");
  if (!btn) return;
  btn.parentElement.innerHTML =
    `<div class="pdfhint">Somente visualização — sem download (direitos autorais).</div>` +
    `<iframe class="pdfview" src="${btn.dataset.src}" title="PDF do artigo"></iframe>`;
});
function showDetail(n) {
  if (!n) { detail.classList.remove("open"); return; }
  const rels = edges.filter(e => e.s === n || e.t === n).map(e => {
    const other = e.s === n ? e.t : e.s;
    const dir = e.s === n ? "→" : "←";
    const note = e.note ? `<div class="note">${esc(e.note)}</div>` : "";
    return `<li><span class="rel">${esc(e.type)}</span> ${dir} ${esc(other.label)}${note}</li>`;
  }).join("");
  const links = [];
  if (n.url)
    links.push(`<a class="ext" href="${esc(n.url)}" target="_blank" rel="noreferrer">` +
      `publicado em ${esc(n.doi || n.venue)} ↗</a>`);
  if (n.cited_in && n.cited_in.length)
    links.push(`<div class="cited"><span class="lbl">citado na tese:</span> ` +
      `${n.cited_in.map(esc).join(" · ")}</div>`);
  const src = pdfSrc(n);
  const isPaper = n.type === "artigo" || n.type === "artigo-pendente";
  const pdfBlock = HOSTED
    ? (isPaper ? `<div class="pdfbox note">PDF disponível na versão local (direitos autorais) — use o link do publicador acima.</div>` : "")
    : (src
        ? `<div class="pdfbox"><button class="pdf-open" data-src="${esc(src)}">Ver PDF (só visualização)</button></div>`
        : (isPaper ? `<div class="pdfbox note">PDF não disponível localmente.</div>` : ""));
  body.innerHTML = `
    <div class="kind">${esc(TYPE_LABEL[n.type] || n.type)}</div>
    <h2>${esc(n.title || n.label)}</h2>
    <div class="meta">${[n.year, n.venue, n.paper_type].filter(Boolean).map(esc).join(" · ")}</div>
    ${links.length ? `<div class="links">${links.join("")}</div>` : ""}
    ${pdfBlock}
    <div class="relhead">Relações${focusSet ? " · em foco no grafo" : ""}</div>
    <ul>${rels || "<li class='note'>sem relações visíveis</li>"}</ul>`;
  detail.classList.add("open");
}

// Enquadra o grafo na tela (evita abrir com zoom no centro vazio).
function fitView() {
  const vs = nodes.filter(isVisible);
  if (!vs.length) return;
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (const n of vs) {
    minx = Math.min(minx, n.x); maxx = Math.max(maxx, n.x);
    miny = Math.min(miny, n.y); maxy = Math.max(maxy, n.y);
  }
  const gw = (maxx - minx) || 1, gh = (maxy - miny) || 1, pad = 70;
  scale = Math.min(2.5, Math.max(0.12, Math.min((W - 2 * pad) / gw, (H - 2 * pad) / gh)));
  ox = W / 2 - (minx + maxx) / 2 * scale;
  oy = H / 2 - (miny + maxy) / 2 * scale;
}

// Assenta o layout antes do primeiro quadro e enquadra na tela.
for (let i = 0; i < 320; i++) step();
fitView();
loop();
</script>
