, "type": "uses_methods"}, {"source": "Karl2023", "target": "modelo:bert", "type": "models"}, {"source": "Karl2023", "target": "dataset:nice", "type": "datasets"}, {"source": "Karl2023", "target": "dataset:stops", "type": "datasets"}, {"source": "Karl2023", "target": "dataset:benchmarks-stc", "type": "datasets"}, {"source": "Karl2023", "target": "tarefa:classificacao-de-texto-curto", "type": "tasks"}, {"source": "Karl2023", "target": "tarefa:classificacao-de-produtos-e-servicos", "type": "tasks"}, {"source": "Karl2023", "target": "FALCO", "type": "fundamenta", "note": "Evidência de que transformers puros são SOTA em texto curto — valida a escolha do BERTimbau como classificador-alvo. E o caso de uso (classificar descrições de produtos/serviços, dataset STOPS de descrições da Amazon) é o mais próximo do nosso na literatura fichada."}, {"source": "Kowsari2019", "target": "pilar:geral", "type": "pillars"}, {"source": "Kowsari2019", "target": "conceito:pipeline-de-4-fases-da-classificacao-de-texto", "type": "proposes"}, {"source": "Kowsari2019", "target": "metodo:extracao-de-atributos", "type": "uses_methods"}, {"source": "Kowsari2019", "target": "metodo:reducao-de-dimensionalidade", "type": "uses_methods"}, {"source": "Kowsari2019", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Kowsari2019", "target": "FALCO", "type": "fundamenta", "note": "Survey-guarda-chuva da classificação de texto: fornece o vocabulário do pipeline (extração de atributos → redução → classificador → avaliação) usado na fundamentação, e as métricas de avaliação padrão."}, {"source": "Lewis1994", "target": "pilar:geral", "type": "pillars"}, {"source": "Lewis1994", "target": "pilar:P2", "type": "pillars"}, {"source": "Lewis1994", "target": "conceito:amostragem-por-incerteza", "type": "proposes"}, {"source": "Lewis1994", "target": "conceito:cenario-pool-based", "type": "proposes"}, {"source": "Lewis1994", "target": "metodo:classificador-probabilistico", "type": "uses_methods"}, {"source": "Lewis1994", "target": "dataset:newswire-categorization", "type": "datasets"}, {"source": "Lewis1994", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Lewis1994", "target": "FALCO", "type": "fundamenta", "note": "Origem do uncertainty sampling E do cenário pool-based — as duas escolhas estruturais do FALCO nasceram aqui, num problema de classificação de texto, o mesmo domínio da tese."}, {"source": "Ren2021", "target": "Settles2012", "type": "extends"}, {"source": "Ren2021", "target": "Settles2012", "type": "builds_on"}, {"source": "Ren2021", "target": "pilar:geral", "type": "pillars"}, {"source": "Ren2021", "target": "pilar:P4", "type": "pillars"}, {"source": "Ren2021", "target": "conceito:taxonomia-deepal", "type": "proposes"}, {"source": "Ren2021", "target": "metodo:deep-active-learning", "type": "uses_methods"}, {"source": "Ren2021", "target": "tarefa:visao-computacional", "type": "tasks"}, {"source": "Ren2021", "target": "tarefa:pln", "type": "tasks"}, {"source": "Ren2021", "target": "FALCO", "type": "fundamenta", "note": "Ponte AL clássico → deep learning: fundamenta o uso de AL com classificadores profundos (BERTimbau no E2/E3) e explica por que o AL 'renasceu' na era DL — modelos famintos por dados anotados caros."}, {"source": "Settles2012", "target": "Angluin1988", "type": "builds_on"}, {"source": "Settles2012", "target": "Cohn1994Improving", "type": "builds_on"}, {"source": "Settles2012", "target": "Lewis1994", "type": "builds_on"}, {"source": "Settles2012", "target": "pilar:geral", "type": "pillars"}, {"source": "Settles2012", "target": "pilar:P2", "type": "pillars"}, {"source": "Settles2012", "target": "conceito:taxonomia-de-cenarios-de-al", "type": "proposes"}, {"source": "Settles2012", "target": "conceito:frameworks-de-selecao-de-consulta", "type": "proposes"}, {"source": "Settles2012", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "Settles2012", "target": "metodo:query-by-committee", "type": "uses_methods"}, {"source": "Settles2012", "target": "metodo:densidade", "type": "uses_methods"}, {"source": "Settles2012", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Settles2012", "target": "FALCO", "type": "fundamenta", "note": "Referência canônica de AL: define o laço consulta→oráculo→treino e os frameworks de seleção que o FALCO combina por fase. É a fonte da terminologia (pool-based, uncertainty sampling) usada em toda a tese."}, {"source": "alsmadi2019shorttext", "target": "song2014shorttext", "type": "extends"}, {"source": "alsmadi2019shorttext", "target": "song2014shorttext", "type": "builds_on"}, {"source": "alsmadi2019shorttext", "target": "pilar:geral", "type": "pillars"}, {"source": "alsmadi2019shorttext", "target": "pilar:P1", "type": "pillars"}, {"source": "alsmadi2019shorttext", "target": "conceito:revisao-por-estagios-do-pipeline", "type": "proposes"}, {"source": "alsmadi2019shorttext", "target": "metodo:selecao-de-atributos", "type": "uses_methods"}, {"source": "alsmadi2019shorttext", "target": "metodo:algoritmos-geneticos", "type": "uses_methods"}, {"source": "alsmadi2019shorttext", "target": "metodo:soft-computing", "type": "uses_methods"}, {"source": "alsmadi2019shorttext", "target": "tarefa:classificacao-de-texto-curto", "type": "tasks"}, {"source": "alsmadi2019shorttext", "target": "FALCO", "type": "fundamenta", "note": "Revisão de STC organizada por estágio do pipeline; aponta algoritmos genéticos como solução promissora para otimização em texto curto — eco direto do nosso P1 (otimização do L0 via AG)."}, {"source": "devlin2019bert", "target": "pilar:P4", "type": "pillars"}, {"source": "devlin2019bert", "target": "conceito:bert", "type": "proposes"}, {"source": "devlin2019bert", "target": "conceito:masked-language-model", "type": "proposes"}, {"source": "devlin2019bert", "target": "conceito:fine-tuning-com-uma-camada", "type": "proposes"}, {"source": "devlin2019bert", "target": "metodo:transformer", "type": "uses_methods"}, {"source": "devlin2019bert", "target": "metodo:pre-treinamento-nao-supervisionado", "type": "uses_methods"}, {"source": "devlin2019bert", "target": "modelo:bert", "type": "models"}, {"source": "devlin2019bert", "target": "dataset:glue", "type": "datasets"}, {"source": "devlin2019bert", "target": "dataset:squad", "type": "datasets"}, {"source": "devlin2019bert", "target": "dataset:multinli", "type": "datasets"}, {"source": "devlin2019bert", "target": "tarefa:compreensao-de-linguagem", "type": "tasks"}, {"source": "devlin2019bert", "target": "FALCO", "type": "fundamenta", "note": "Base arquitetural do classificador-alvo: BERTimbau (usado nos E2/E3 via HuggingFace) é um BERT pré-treinado em português. O paradigma pré-treino + fine-tuning é o que torna o AL viável com poucos rótulos."}, {"source": "song2014shorttext", "target": "pilar:geral", "type": "pillars"}, {"source": "song2014shorttext", "target": "conceito:caracterizacao-de-texto-curto", "type": "proposes"}, {"source": "song2014shorttext", "target": "metodo:analise-semantica", "type": "uses_methods"}, {"source": "song2014shorttext", "target": "metodo:semi-supervisao", "type": "uses_methods"}, {"source": "song2014shorttext", "target": "metodo:ensemble", "type": "uses_methods"}, {"source": "song2014shorttext", "target": "tarefa:classificacao-de-texto-curto", "type": "tasks"}, {"source": "song2014shorttext", "target": "FALCO", "type": "fundamenta", "note": "Define as quatro dificuldades canônicas do texto curto (esparsidade, larga escala, imediatismo, não-padronização) — a caracterização do nosso objeto de estudo (descrições de produto ~20–40 caracteres)."}, {"source": "zhang2022surveyAL", "target": "Settles2012", "type": "builds_on"}, {"source": "zhang2022surveyAL", "target": "Ren2021", "type": "builds_on"}, {"source": "zhang2022surveyAL", "target": "Lewis1994", "type": "builds_on"}, {"source": "zhang2022surveyAL", "target": "Cohn1994Improving", "type": "builds_on"}, {"source": "zhang2022surveyAL", "target": "pilar:geral", "type": "pillars"}, {"source": "zhang2022surveyAL", "target": "pilar:P2", "type": "pillars"}, {"source": "zhang2022surveyAL", "target": "pilar:P4", "type": "pillars"}, {"source": "zhang2022surveyAL", "target": "conceito:taxonomia-de-estrategias-de-consulta", "type": "proposes"}, {"source": "zhang2022surveyAL", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "zhang2022surveyAL", "target": "metodo:representatividade", "type": "uses_methods"}, {"source": "zhang2022surveyAL", "target": "metodo:cold-start", "type": "uses_methods"}, {"source": "zhang2022surveyAL", "target": "metodo:criterio-de-parada", "type": "uses_methods"}, {"source": "zhang2022surveyAL", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "zhang2022surveyAL", "target": "tarefa:predicao-estruturada", "type": "tasks"}, {"source": "zhang2022surveyAL", "target": "FALCO", "type": "fundamenta", "note": "Survey-espinha-dorsal do Cap.2: organiza estratégias de consulta (informatividade vs representatividade), cold-start e parada — exatamente os eixos das fases do FALCO. Anterior à era dos LLMs-como-oráculo, o que demarca a lacuna que a tese ocupa."}]};

const TYPE_LABEL = {
  "artigo": "Artigos fichados", "artigo-pendente": "A fichar", "framework": "FALCO",
  "pilar": "Pilares", "metodo": "Métodos", "conceito": "Conceitos propostos",
  "modelo": "Modelos", "dataset": "Datasets", "tarefa": "Tarefas"
};
const TYPE_VAR = {
  "artigo": "--artigo", "artigo-pendente": "--pendente", "framework": "--framework",
  "pilar": "--pilar", "metodo": "--metodo", "conceito": "--conceito",
  "modelo": "--modelo", "dataset": "--dataset", "tarefa": "--tarefa"
};
const RADIUS = { "framework": 16, "artigo": 9, "artigo-pendente": 6, "pilar": 11 };
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const nodes = GRAPH.nodes.map(n => ({ ...n,
  x: Math.random() * 800 - 400, y: Math.random() * 600 - 300, vx: 0, vy: 0,
  r: RADIUS[n.type] || 7 }));
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
const edges = GRAPH.edges.filter(e => byId[e.source] && byId[e.target])
  .map(e => ({ ...e, s: byId[e.source], t: byId[e.target] }));
const degree = {};
edges.forEach(e => { degree[e.source] = (degree[e.source]||0)+1; degree[e.target] = (degree[e.target]||0)+1; });
nodes.forEach(n => { if (n.type === "artigo") n.r = 8 + Math.min(6, (degree[n.id]||0) * 0.35); });

const visible = {}; Object.keys(TYPE_LABEL).forEach(t => visible[t] = true);
["modelo","dataset","tarefa"].forEach(t => visible[t] = false); // começa focado

const filters = document.getElementById("filters");
const present = new Set(nodes.map(n => n.type));
for (const t of Object.keys(TYPE_LABEL)) {
  if (!present.has(t)) continue;
  const label = document.createElement("label");
  const cb = Object.assign(document.createElement("input"), { type: "checkbox", checked: visible[t] });
  cb.addEventListener("change", () => { visible[t] = cb.checked; });
  const sw = document.createElement("span"); sw.className = "swatch";
  sw.style.background = css(TYPE_VAR[t]);
  label.append(cb, sw, TYPE_LABEL[t]);
  filters.append(label);
}
document.getElementById("stats").textContent =
  `${nodes.filter(n=>n.type==="artigo").length} artigos · ${edges.length} relações`;

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W, H, DPR = Math.min(2, window.devicePixelRatio || 1);
let scale = 1, ox = 0, oy = 0;
function resize() {
  const rect = cv.parentElement.getBoundingClientRect();
  W = rect.width; H = rect.height;
  cv.width = W * DPR; cv.height = H * DPR;
  ox = ox || W / 2; oy = oy || H / 2;
}
window.addEventListener("resize", resize); resize();

function isVisible(n) { return visible[n.type]; }

function step() {
  const vs = nodes.filter(isVisible);
  for (const n of vs) { n.vx *= 0.85; n.vy *= 0.85; }
  for (let i = 0; i < vs.length; i++) for (let j = i + 1; j < vs.length; j++) {
    const a = vs[i], b = vs[j];
    let dx = b.x - a.x, dy = b.y - a.y, d2 = dx*dx + dy*dy || 1;
    if (d2 < 90000) {
      const f = 1400 / d2, d = Math.sqrt(d2);
      dx /= d; dy /= d;
      a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
    }
  }
  for (const e of edges) {
    if (!isVisible(e.s) || !isVisible(e.t)) continue;
    let dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1, want = e.t.type === "framework" || e.s.type === "framework" ? 190 : 120;
    const f = (d - want) * 0.004; dx /= d; dy /= d;
    e.s.vx += dx * f * d * 0.02; e.s.vy += dy * f * d * 0.02;
    e.t.vx -= dx * f * d * 0.02; e.t.vy -= dy * f * d * 0.02;
  }
  for (const n of vs) {
    n.vx -= n.x * 0.0012; n.vy -= n.y * 0.0012; // gravidade ao centro
    if (n !== dragNode) { n.x += n.vx; n.y += n.vy; }
  }
}

let selected = null, hover = null;
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.translate(ox, oy); ctx.scale(scale, scale);
  const edgeCol = css("--edge"), falcoCol = css("--edge-falco");
  for (const e of edges) {
    if (!isVisible(e.s) || !isVisible(e.t)) continue;
    const toFalco = e.t.type === "framework";
    ctx.strokeStyle = toFalco ? falcoCol : edgeCol;
    ctx.lineWidth = (selected && (e.s === selected || e.t === selected)) ? 2.2 : (toFalco ? 1.4 : 0.8);
    ctx.beginPath(); ctx.moveTo(e.s.x, e.s.y); ctx.lineTo(e.t.x, e.t.y); ctx.stroke();
  }
  for (const n of nodes) {
    if (!isVisible(n)) continue;
    const col = css(TYPE_VAR[n.type] || "--muted");
    if (n === selected || n === hover) {
      ctx.fillStyle = css("--halo");
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 8, 0, 7); ctx.fill();
    }
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.fill();
    if (n.type === "artigo-pendente") {
      ctx.strokeStyle = css("--bg"); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r - 2, 0, 7); ctx.stroke();
    }
    if (scale > 0.55 || n.r >= 11 || n === selected || n === hover) {
      ctx.fillStyle = css("--ink");
      ctx.font = `${n.type === "framework" ? "700 13px Georgia, serif" : "11px system-ui"}`;
      ctx.textAlign = "center";
      ctx.fillText(n.label, n.x, n.y - n.r - 5);
    }
  }
}

function loop() { step(); draw(); requestAnimationFrame(loop); }
// (iniciado no fim do script, após TODAS as declarações — step() lê dragNode)

function pick(mx, my) {
  const x = (mx - ox) / scale, y = (my - oy) / scale;
  let best = null, bestD = 1e9;
  for (const n of nodes) {
    if (!isVisible(n)) continue;
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < n.r + 6 && d < bestD) { best = n; bestD = d; }
  }
  return best;
}

let dragNode = null, panning = false, px = 0, py = 0, moved = false;
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId); moved = false;
  const n = pick(e.offsetX, e.offsetY);
  if (n) { dragNode = n; cv.classList.add("dragging"); }
  else { panning = true; px = e.offsetX; py = e.offsetY; }
});
cv.addEventListener("pointermove", e => {
  if (dragNode) {
    moved = true;
    dragNode.x = (e.offsetX - ox) / scale; dragNode.y = (e.offsetY - oy) / scale;
    dragNode.vx = dragNode.vy = 0;
  } else if (panning) {
    moved = true; ox += e.offsetX - px; oy += e.offsetY - py; px = e.offsetX; py = e.offsetY;
  } else hover = pick(e.offsetX, e.offsetY);
});
cv.addEventListener("pointerup", e => {
  if (!moved) {
    const n = pick(e.offsetX, e.offsetY);
    selected = n; showDetail(n);
  }
  dragNode = null; panning = false; cv.classList.remove("dragging");
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.12 : 0.89, ns = Math.min(4, Math.max(0.25, scale * k));
  ox = e.offsetX - (e.offsetX - ox) * (ns / scale);
  oy = e.offsetY - (e.offsetY - oy) * (ns / scale);
  scale = ns;
}, { passive: false });

const detail = document.getElementById("detail"), body = document.getElementById("detail-body");
document.getElementById("close").addEventListener("click", () => { detail.classList.remove("open"); selected = null; });
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function showDetail(n) {
  if (!n) { detail.classList.remove("open"); return; }
  const rels = edges.filter(e => e.s === n || e.t === n).map(e => {
    const other = e.s === n ? e.t : e.s;
    const dir = e.s === n ? "→" : "←";
    const note = e.note ? `<div class="note">${esc(e.note)}</div>` : "";
    return `<li><span class="rel">${esc(e.type)}</span> ${dir} ${esc(other.label)}${note}</li>`;
  }).join("");
  body.innerHTML = `
    <div class="kind">${esc(TYPE_LABEL[n.type] || n.type)}</div>
    <h2>${esc(n.title || n.label)}</h2>
    <div class="meta">${[n.year, n.venue, n.paper_type].filter(Boolean).map(esc).join(" · ")}</div>
    <ul>${rels || "<li class='note'>sem relações visíveis</li>"}</ul>`;
  detail.classList.add("open");
}

loop();
</script>
