 "Agnihotri2018", "target": "pilar:geral", "type": "pillars"}, {"source": "Agnihotri2018", "target": "FALCO", "type": "contextualiza", "note": "Herança da dissertação; linha de ponderação de termos."}, {"source": "Ahmed2022", "target": "pilar:p2-texto-curto", "type": "pillars"}, {"source": "Ahmed2022", "target": "metodo:agrupamento-de-texto-curto", "type": "uses_methods"}, {"source": "Ahmed2022", "target": "metodo:reducao-de-dimensionalidade", "type": "uses_methods"}, {"source": "Ahmed2022", "target": "metodo:medida-de-similaridade", "type": "uses_methods"}, {"source": "Ahmed2022", "target": "metodo:expansao-de-corpus", "type": "uses_methods"}, {"source": "Ahmed2022", "target": "tarefa:agrupamento-de-texto", "type": "tasks"}, {"source": "Ahmed2022", "target": "texto-curto", "type": "fundamenta", "note": "Fonte de revisão para os desafios do regime de texto curto que o Cap. 2 enumera: escassez de informação/contexto, esparsidade de representação e alta dimensionalidade, ruído e informalidade. O survey trata o problema do lado do AGRUPAMENTO, mas os desafios que enumera são da natureza do texto curto, não da tarefa — ver a ressalva abaixo."}, {"source": "Alom2019", "target": "pilar:geral", "type": "pillars"}, {"source": "Alom2019", "target": "FALCO", "type": "contextualiza", "note": "Guarda-chuva de DL; preferir Goodfellow/Minaee conforme o contexto."}, {"source": "Alsmadi2019", "target": "Song2014", "type": "extends"}, {"source": "Alsmadi2019", "target": "Song2014", "type": "builds_on"}, {"source": "Alsmadi2019", "target": "pilar:geral", "type": "pillars"}, {"source": "Alsmadi2019", "target": "pilar:P1", "type": "pillars"}, {"source": "Alsmadi2019", "target": "conceito:revisao-por-estagios-do-pipeline", "type": "proposes"}, {"source": "Alsmadi2019", "target": "metodo:selecao-de-atributos", "type": "uses_methods"}, {"source": "Alsmadi2019", "target": "metodo:algoritmos-geneticos", "type": "uses_methods"}, {"source": "Alsmadi2019", "target": "metodo:soft-computing", "t efa:classificacao", "type": "tasks"}, {"source": "Ban2022", "target": "FALCO", "type": "contextualiza", "note": "Estado da arte teórico do AL neural (NeurIPS 2022, streaming, exploração+explotação com a própria rede): mostra a fronteira formal do campo — que segue ignorando o custo/ruído do ORÁCULO, nosso foco."}, {"source": "Bard2019Normalizador", "target": "Javed2018", "type": "compares_with"}, {"source": "Bard2019Normalizador", "target": "pilar:geral", "type": "pillars"}, {"source": "Bard2019Normalizador", "target": "conceito:normalizador-portugues-por-lm", "type": "proposes"}, {"source": "Bard2019Normalizador", "target": "metodo:modelo-de-linguagem", "type": "uses_methods"}, {"source": "Bard2019Normalizador", "target": "metodo:normalizacao", "type": "uses_methods"}, {"source": "Bard2019Normalizador", "target": "tarefa:normalizacao", "type": "tasks"}, {"source": "Bard2019Normalizador", "target": "FALCO", "type": "contextualiza", "note": "Normalização de texto informal PARA PORTUGUÊS via modelo de linguagem (PUCRS): precedente nacional da ideia de usar LM para padronizar texto fora da norma — que o FALCO leva ao extremo com o expanded_description do oráculo LLM."}, {"source": "Basha2019", "target": "pilar:geral", "type": "pillars"}, {"source": "Basha2019", "target": "FALCO", "type": "contextualiza", "note": "Herança do draft; seção de redução foi condensada no W7."}, {"source": "Bayer2024ActiveLLM", "target": "Yuan2020", "type": "compares_with"}, {"source": "Bayer2024ActiveLLM", "target": "Settles2012", "type": "builds_on"}, {"source": "Bayer2024ActiveLLM", "target": "pilar:P2", "type": "pillars"}, {"source": "Bayer2024ActiveLLM", "target": "pilar:P3", "type": "pillars"}, {"source": "Bayer2024ActiveLLM", "target": "conceito:llm-como-seletor", "type": "proposes"}, {"source": "Bayer2024ActiveLLM", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Bayer2024ActiveLLM", "target": "metodo:few-shot", "type": "uses_methods"}, {"source": "Bayer2024 blema (seleção balanceada sem rótulos) em fase diferente: CBAL balanceia DURANTE os ciclos usando pseudo-rótulos do modelo; DRI-SL balanceia o L0 ANTES de existir modelo, via densidade semântica + variedade lexical. Par natural de confronto no Cap.2."}, {"source": "Bhavani2021", "target": "pilar:geral", "type": "pillars"}, {"source": "Bhavani2021", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Bhavani2021", "target": "FALCO", "type": "contextualiza", "note": "Review citado na dissertação Daru2024; arquivado por rastreabilidade da cadeia bibliográfica."}, {"source": "Birunda2021", "target": "Naseem2021WordRep", "type": "compares_with"}, {"source": "Birunda2021", "target": "Mikolov2013", "type": "builds_on"}, {"source": "Birunda2021", "target": "Pennington2014", "type": "builds_on"}, {"source": "Birunda2021", "target": "pilar:geral", "type": "pillars"}, {"source": "Birunda2021", "target": "metodo:embeddings", "type": "uses_methods"}, {"source": "Birunda2021", "target": "tarefa:representacao-de-palavras", "type": "tasks"}, {"source": "Birunda2021", "target": "FALCO", "type": "contextualiza", "note": "Review de embeddings citado na dissertação Daru2024 (herança). Constata três famílias dominantes de embedding. Preferir Naseem2021WordRep em citações novas."}, {"source": "Blum1999", "target": "pilar:geral", "type": "pillars"}, {"source": "Blum1999", "target": "conceito:garantias-para-kfold", "type": "proposes"}, {"source": "Blum1999", "target": "conceito:validacao-progressiva", "type": "proposes"}, {"source": "Blum1999", "target": "metodo:analise-teorica", "type": "uses_methods"}, {"source": "Blum1999", "target": "tarefa:validacao-de-modelos", "type": "tasks"}, {"source": "Blum1999", "target": "FALCO", "type": "fundamenta", "note": "Garantias teóricas de que k-fold não é pior que hold-out como estimador de generalização — lastro formal da seção de validação do Cap.2."}, {"source": "BlumMansour2007", "target": "pilar:geral", "type": "pillars"}, { ng", "target": "FALCO", "type": "fundamenta", "note": "Formaliza o selective sampling (consultar um oráculo apenas nas regiões 'úteis' do domínio) e prova que aprendizado ativo pode ser mais poderoso que aprendizado passivo — a garantia conceitual por trás do laço do FALCO."}, {"source": "Daru2022", "target": "Song2014", "type": "builds_on"}, {"source": "Daru2022", "target": "Alsmadi2019", "type": "builds_on"}, {"source": "Daru2022", "target": "pilar:geral", "type": "pillars"}, {"source": "Daru2022", "target": "pilar:P4", "type": "pillars"}, {"source": "Daru2022", "target": "conceito:argmaxtf", "type": "proposes"}, {"source": "Daru2022", "target": "conceito:argmaxtfnorm", "type": "proposes"}, {"source": "Daru2022", "target": "conceito:argmaxtfidf", "type": "proposes"}, {"source": "Daru2022", "target": "metodo:bag-of-words", "type": "uses_methods"}, {"source": "Daru2022", "target": "metodo:regressao-logistica", "type": "uses_methods"}, {"source": "Daru2022", "target": "metodo:svm", "type": "uses_methods"}, {"source": "Daru2022", "target": "metodo:validacao-cruzada-30-fold", "type": "uses_methods"}, {"source": "Daru2022", "target": "dataset:retail-product-description-ptbr", "type": "datasets"}, {"source": "Daru2022", "target": "tarefa:classificacao-de-texto-curto", "type": "tasks"}, {"source": "Daru2022", "target": "tarefa:classificacao-de-produtos-e-servicos", "type": "tasks"}, {"source": "Daru2022", "target": "FALCO", "type": "fundamenta", "note": "Trabalho anterior do próprio autor sobre O MESMO problema e dados: estabelece os baselines supervisionados clássicos (argmax*, LR, SVM) sobre descrições de produto em português. O FALCO parte de onde este artigo para: a pergunta deixa de ser 'qual classificador' e passa a ser 'como obter os rótulos com custo mínimo'."}, {"source": "Daru2024Dissertacao", "target": "Daru2022", "type": "extends"}, {"source": "Daru2024Dissertacao", "target": "Daru2022", "type": "builds_on"}, {"source": "Daru2024Dissertacao", "target": "pilar:geral", "type": "pillars"}, {"source": "Daru2024Dissertacao", "target": "pilar:P4", "type": "pillars"}, {"source": "Daru2024Dissertacao", "target": "conceito:argmax-binary", "type": "proposes"}, {"source": "Daru2024Dissertacao", "target": "metodo:bag-of-words", "type": "uses_methods"}, {"source": "Daru2024Dissertacao", "target": "metodo:n-gramas", "type": "uses_methods"}, {"source": "Daru2024Dissertacao", "target": "metodo:normalizacao-l2", "type": "uses_methods"}, {"source": "Daru2024Dissertacao", "target": "metodo:validacao-cruzada", "type": "uses_methods"}, {"source": "Daru2024Dissertacao", "target": "dataset:retail-product-description-ptbr", "type": "datasets"}, {"source": "Daru2024Dissertacao", "target": "tarefa:classificacao-de-texto-curto", "type": "tasks"}, {"source": "Daru2024Dissertacao", "target": "tarefa:classificacao-de-produtos-e-servicos", "type": "tasks"}, {"source": "Daru2024Dissertacao", "target": "FALCO", "type": "fundamenta", "note": "Antecedente direto da tese (mestrado do autor, mesmos dados): otimiza a família Argmax e estabelece o melhor baseline leve conhecido do dataset (Binary [1,2] sem L2: acc 89,56%, Macro-F1 70,09%). O gap acc↔Macro-F1 de ~19 p.p. quantifica o problema das classes raras que o FALCO enfrenta."}, {"source": "Deerwester1990", "target": "Salton1988", "type": "extends"}, {"source": "Deerwester1990", "target": "Salton1988", "type": "builds_on"}, {"source": "Deerwester1990", "target": "pilar:geral", "type": "pillars"}, {"source": "Deerwester1990", "target": "conceito:lsa", "type": "proposes"}, {"source": "Deerwester1990", "target": "conceito:indexacao-semantica-latente", "type": "proposes"}, {"source": "Deerwester1990", "target": "metodo:svd", "type": "uses_methods"}, {"source": "Deerwester1990", "target": "metodo:fatoracao-matricial", "type": "uses_methods"}, {"source": "Deerwester1990", "target": "tarefa:recuperacao-de-informacao", "type": "tasks"}, {"source": "Deerwester1990", "target": "FALCO", "type": "fundamenta", "note": "Primeiro passo esparso→denso (SVD sobre termo-documento): ancestral conceitual dos embeddings; na linha do Cap.2 fica entre TF-IDF e word2vec. Ataca sinonímia/polissemia — os problemas centrais do texto curto de varejo (CERV vs cerveja)."}, {"source": "Demsar2006", "target": "pilar:transversal", "type": "pillars"}, {"source": "Demsar2006", "target": "conceito:protocolo-de-comparacao-estatistica-de-classificadores", "type": "proposes"}, {"source": "Demsar2006", "target": "instrumentacao-estatistica", "type": "fundamenta", "note": "A referência APLICADA canônica para comparação estatística de classificadores em ML: recomenda testes NÃO-paramétricos (Wilcoxon signed-ranks para 2 classificadores; Friedman+post-hoc para vários) sobre t-testes, por violação de normalidade e comensurabilidade. Fundamenta nossa escolha do Wilcoxon pareado por semente (E1/E4) na subseção de inferência do Cap. 2 (plano 2.1.4)."}, {"source": "Deng2019", "target": "pilar:geral", "type": "pillars"}, {"source": "Deng2019", "target": "FALCO", "type": "contextualiza", "note": "Review específico de texto — preferível ao genérico Cai2018 quando o assunto é texto."}, {"source": "Deng2023fedal", "target": "pilar:P1", "type": "pillars"}, {"source": "Deng2023fedal", "target": "conceito:aprendizado-ativo-federado", "type": "proposes"}, {"source": "Deng2023fedal", "target": "conceito:entropia-de-ensemble", "type": "proposes"}, {"source": "Deng2023fedal", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Deng2023fedal", "target": "metodo:pool-based", "type": "uses_methods"}, {"source": "Deng2023fedal", "target": "metodo:entropia", "type": "uses_methods"}, {"source": "Deng2023fedal", "target": "metodo:aprendizado-federado", "type": "uses_methods"}, {"source": "Deng2023fedal", "target": "metodo:selecao-aleatoria", "type": "uses_methods"}, {"source": "Deng2023fedal", "target": "metodo:fine-tuning", "type": "uses_methods"}, {"source": "Deng2023fedal", "target": "modelo:resnet101", "type": "models"}, {"source": "Deng2023fedal", "target": "dataset:ham10k", "type": "datasets"}, {"source": "Deng2023fedal", "target": "dataset:msk-isic", "type": "datasets"}, {"source": "Deng2023fedal", "target": "tarefa:classificacao-de-imagens", "type": "tasks"}, {"source": "Deng2023fedal", "target": "FALCO", "type": "complementa", "note": "Sustenta a menção ao cenário FEDERADO em 2-fundam:327, que é uma das três extensões do laço clássico listadas ali. Não compete com o FALCO: o eixo dele é privacidade entre instituições, não custo de oráculo. Serve como terceiro ponto da série regime × ganho da seleção — ver 'Ideias que gera'."}, {"source": "Devlin2019", "target": "pilar:P4", "type": "pillars"}, {"source": "Devlin2019", "target": "conceito:bert", "type": "proposes"}, {"source": "Devlin2019", "target": "conceito:masked-language-model", "type": "proposes"}, {"source": "Devlin2019", "target": "conceito:fine-tuning-com-uma-camada", "type": "proposes"}, {"source": "Devlin2019", "target": "metodo:transformer", "type": "uses_methods"}, {"source": "Devlin2019", "target": "metodo:pre-treinamento-nao-supervisionado", "type": "uses_methods"}, {"source": "Devlin2019", "target": "modelo:bert", "type": "models"}, {"source": "Devlin2019", "target": "dataset:glue", "type": "datasets"}, {"source": "Devlin2019", "target": "dataset:squad", "type": "datasets"}, {"source": "Devlin2019", "target": "dataset:multinli", "type": "datasets"}, {"source": "Devlin2019", "target": "tarefa:compreensao-de-linguagem", "type": "tasks"}, {"source": "Devlin2019", "target": "FALCO", "type": "fundamenta", "note": "Base arquitetural do classificador-alvo: BERTimbau (usado nos E2/E3 via HuggingFace) é um BERT pré-treinado em português. O paradigma pré-treino + fine-tuning é o que torna o AL viável com poucos rótulos."}, {"source": "Dietterich1998", "target": "pilar:transversal", "type": "pillars"}, {"source": "Dietterich1998", "target": "conceito:taxonomia-de-testes-para-classificadores", "type": "proposes"}, {"source": "Dietterich1998", "target": "conceito:5x2cv", "type": "proposes"}, {"source": "Dietterich1998", "target": "instrumentacao-estatistica", "type": "fundamenta", "note": "Clássico que examina 5 testes para comparar classificadores e mede erro tipo I/poder: recomenda McNEMAR quando só há UMA execução de treino (nosso caso E0: oráculos fixos sobre a mesma amostra) e o 5x2cv quando re-treino é viável. Fundamenta a escolha do McNemar na subseção 2.1.4 do plano."}, {"source": "Dogra2022", "target": "pilar:geral", "type": "pillars"}, {"source": "Dogra2022", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Dogra2022", "target": "FALCO", "type": "contextualiza", "note": "Review de processo; sobreposto a Minaee2022/Gasparetto2022."}, {"source": "Donmez2008", "target": "pilar:p3-oraculo", "type": "pillars"}, {"source": "Donmez2008", "target": "conceito:aprendizado-proativo", "type": "proposes"}, {"source": "Donmez2008", "target": "conceito:selecao-conjunta-instancia-oraculo", "type": "proposes"}, {"source": "Donmez2008", "target": "conceito:restricao-de-orcamento", "type": "proposes"}, {"source": "Donmez2008", "target": "conceito:oraculo-relutante", "type": "proposes"}, {"source": "Donmez2008", "target": "conceito:oraculo-falivel", "type": "proposes"}, {"source": "Donmez2008", "target": "conceito:custo-nao-uniforme", "type": "proposes"}, {"source": "Donmez2008", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Donmez2008", "target": "metodo:pool-based", "type": "uses_methods"}, {"source": "Donmez2008", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "Donmez2008", "target": "metodo:agrupamento-por-k-medias", "type": "uses_methods"}, {"source": "Donmez2008", "target": "modelo:regressao-logistica", "type": "models"}, {"source": "Donmez2008", "target": "dataset:face", "type": "datasets"}, {"source": "Donmez2008", "target": "dataset:spambase", "type": "datasets"}, {"source": "Donmez2008", "target": "dataset:adult", "type": "datasets"}, {"source": "Donmez2008", "target": "dataset:uci-letter", "type": "datasets"}, {"source": "Donmez2008", "target": "tarefa:classificacao-binaria", "type": "tasks"}, {"source": "Donmez2008", "target": "oraculo-progressivo", "type": "fundamenta", "note": "É a formulação de origem do problema que o FALCO instancia: quando existem VÁRIOS oráculos com custos e confiabilidades diferentes, a decisão do laço deixa de ser 'qual instância rotular' e passa a ser o PAR 'qual instância, com qual oráculo', sob restrição de orçamento e não de número de rótulos. É o antecedente formal da progressão de fases (LLM barata → LLM cara → humano) e do orçamento como unidade de comparação no lugar da contagem de rótulos."}, {"source": "Donmez2008", "target": "multiplos-oraculos", "type": "fundamenta", "note": "Nomeia as quatro suposições que o oráculo clássico carrega — infalível, incansável, individual e insensível a custo — e relaxa as quatro. A Seção 2.2.3 da tese trata as três primeiras com Sheng2008/Snow2008/Donmez2009/Yan2011; ESTA é a que sustenta a quarta (custo distinto por oráculo), hoje sem lastro no texto."}, {"source": "Donmez2009", "target": "Donmez2008", "type": "builds_on"}, {"source": "Donmez2009", "target": "pilar:p3-oraculo", "type": "pillars"}, {"source": "Donmez2009", "target": "conceito:iethresh", "type": "proposes"}, {"source": "Donmez2009", "target": "conceito:estimacao-de-acuracia-de-anotadores", "type": "proposes"}, {"source": "Donmez2009", "target": "conceito:selecao-de-anotador", "type": "proposes"}, {"source": "Donmez2009", "target": "multiplos-oraculos", "type": "fundamenta", "note": "Aprende a acurácia de múltiplas fontes de rotulagem DURANTE o laço (IEThresh: intervalos de confiança sobre a taxa de acerto estimada de cada anotador) e roteia consultas para as fontes confiáveis. Citado na Seção 2.2.3; é o antecedente formal da seleção de oráculo do FALCO — que substitui a estimação online pela medição pré-registrada do E0 (acurácia + custo por oráculo candidato)."}, {"source": "Du2019", "target": "pilar:geral", "type": "pillars"}, {"source": "Du2019", "target": "FALCO", "type": "contextualiza", "note": "Reviews de produto: domínio adjacente ao nosso."}, {"source": "EfronTibshirani1993", "target": "LCE", "type": "fundamenta", "note": "Intervalo de confiança bootstrap percentil para funcional sem distribuição conhecida — é como a tese põe barra de erro na diferença de LCE (E3)."}, {"source": "EinDor2020", "target": "Sener2018", "type": "builds_on"}, {"source": "EinDor2020", "target": "Devlin2019", "type": "builds_on"}, {"source": "EinDor2020", "target": "pilar:P1", "type": "pillars"}, {"source": "EinDor2020", "target": "pilar:P4", "type": "pillars"}, {"source": "EinDor2020", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "EinDor2020", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "EinDor2020", "target": "metodo:menor-confianca", "type": "uses_methods"}, {"source": "EinDor2020", "target": "metodo:core-set-selection", "type": "uses_methods"}, {"source": "EinDor2020", "target": "metodo:discriminative-active-learning", "type": "uses_methods"}, {"source": "EinDor2020", "target": "metodo:selecao-aleatoria", "type": "uses_methods"}, {"source": "EinDor2020", "target": "metodo:fine-tuning", "type": "uses_methods"}, {"source": "EinDor2020", "target": "modelo:bert", "type": "models"}, {"source": "EinDor2020", "target": "dataset:agnews", "type": "datasets"}, {"source": "EinDor2020", "target": "dataset:subjectivity", "type": "datasets"}, {"source": "EinDor2020", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "EinDor2020", "target": "FALCO", "type": "fundamenta", "note": "Estudo empírico de referência sobre aprendizado ativo com BERT sob orçamento pequeno e classe rara — as duas condições do FALCO. Dá base externa para esperar ganho da seleção nesse regime."}, {"source": "EinDor2020", "target": "LCE", "type": "motiva", "note": "IMPORTANTE, e é o que a R4 do t5 mandou verificar: este trabalho mede ORÇAMENTO em número de anotações, nunca em dinheiro. Não há avaliação de custo financeiro nem de compromisso custo-benefício monetário. Isso não enfraquece a citação da tese — SUSTENTA a lacuna que ela alega. Ver a seção 'Sobre a frase da L813'."}, {"source": "Farquhar2021Bias", "target": "MacKay1992", "type": "builds_on"}, {"source": "Farquhar2021Bias", "target": "Lewis1994", "type": "builds_on"}, {"source": "Farquhar2021Bias", "target": "Settles2009", "type": "builds_on"}, {"source": "Farquhar2021Bias", "target": "Houlsby2011", "type": "builds_on"}, {"source": "Farquhar2021Bias", "target": "pilar:P4", "type": "pillars"}, {"source": "Farquhar2021Bias", "target": "conceito:estimador-pure", "type": "proposes"}, {"source": "Farquhar2021Bias", "target": "conceito:estimador-lure", "type": "proposes"}, {"source": "Farquhar2021Bias", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Farquhar2021Bias", "target": "metodo:pool-based", "type": "uses_methods"}, {"source": "Farquhar2021Bias", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "Farquhar2021Bias", "target": "modelo:rede-neural-bayesiana", "type": "models"}, {"source": "Farquhar2021Bias", "target": "modelo:regressao-linear", "type": "models"}, {"source": "Farquhar2021Bias", "target": "dataset:mnist", "type": "datasets"}, {"source": "Farquhar2021Bias", "target": "dataset:fashion-mnist", "type": "datasets"}, {"source": "Farquhar2021Bias", "target": "tarefa:classificacao-de-imagens", "type": "tasks"}, {"source": "Farquhar2021Bias", "target": "tarefa:regressao", "type": "tasks"}, {"source": "Farquhar2021Bias", "target": "FALCO", "type": "fundamenta", "note": "Estabelece formalmente o FENÔMENO que o E6 da tese mede: o risco estimado sobre dados coletados ativamente é enviesado porque a amostra ativa não segue a distribuição populacional. É a citação obrigatória do parecer R6 item 10 [Dom-M3]: a tese cita o fenômeno daqui e reivindica apenas a QUANTIFICAÇÃO no seu cenário (texto curto pt-BR, oráculo LLM, avaliação interna vs. externa)."}, {"source": "Farquhar2021Bias", "target": "FALCO", "type": "ameaca", "note": "Se a tese avaliasse o laço só no teste interno (dados coletados ativamente), estaria usando exatamente o estimador viesado R̃ que este paper desmonta. O desenho do E6 (população reservada) e o conjunto de validação reservado exigido pelo FALCO respondem a essa ameaça; o paper também oferece a alternativa não adotada (reponderação LURE), que a tese deve discutir como trabalho futuro."}, {"source": "Feldman2013", "target": "pilar:geral", "type": "pillars"}, {"source": "Feldman2013", "target": "FALCO", "type": "contextualiza", "note": "Aplicação vizinha; herança."}, {"source": "Forman2010", "target": "pilar:geral", "type": "pillars"}, {"source": "Forman2010", "target": "conceito:f1-agregado-corretamente-em-cv", "type": "proposes"}, {"source": "Forman2010", "target": "metodo:validacao-cruzada", "type": "uses_methods"}, {"source": "Forman2010", "target": "tarefa:avaliacao-de-classificadores", "type": "tasks"}, {"source": "Forman2010", "target": "FALCO", "type": "fundamenta", "note": "Armadilhas de computar F1/AUC em validação cruzada (formas incompatíveis entre papers/software): diretamente aplicável a como agregamos Macro-F1 entre dobras/repetições nos E1–E3. (Arquivo veio rotulado como Forman 2003; identidade corrigida.)"}, {"source": "Frenay2014", "target": "pilar:P2", "type": "pillars"}, {"source": "Frenay2014", "target": "pilar:P3", "type": "pillars"}, {"source": "Frenay2014", "target": "conceito:taxonomia-ncar-nar-nnar", "type": "proposes"}, {"source": "Frenay2014", "target": "metodo:ruido-simetrico", "type": "uses_methods"}, {"source": "Frenay2014", "target": "metodo:ruido-assimetrico", "type": "uses_methods"}, {"source": "Frenay2014", "target": "metodo:ruido-de-par", "type": "uses_methods"}, {"source": "Frenay2014", "target": "metodo:ruido-dependente-da-instancia", "type": "uses_methods"}, {"source": "Frenay2014", "target": "metodo:matriz-de-transicao-de-ruido", "type": "uses_methods"}, {"source": "Frenay2014", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Frenay2014", "target": "DRI-SL", "type": "fundamenta", "note": "É a fonte formal da taxonomia de ruído de rótulo, anterior e mais rigorosa que o Song2023NoisyLabels: NCAR (uniforme), NAR (dependente da classe verdadeira, que inclui o RUÍDO DE PAR) e NNAR (dependente da instância). O 'ruído estruturado, concentrado em pares vizinhos' que a tese descreve tem nome formal aqui: **pairwise label noise**, caso particular do NAR."}, {"source": "Frenay2014", "target": "FALCO", "type": "ameaca", "note": "ATENÇÃO — junto com o Song2023NoisyLabels, esta ficha FECHA a verificação da frase de 5-resultados-falco/texto.tex:143. As duas fontes citadas ali para sustentar que o ruído estruturado é 'menos danoso que o uniforme' foram lidas, e NENHUMA sustenta a afirmação. Este survey diz o oposto na direção que mede, e traz um agravante específico para o nosso caso de 621 classes — ver a seção 'Veredito'."}, {"source": "Fushiki2011", "target": "pilar:geral", "type": "pillars"}, {"source": "Fushiki2011", "target": "FALCO", "type": "contextualiza", "note": "Lastro estatístico do k-fold usado nos protocolos da tese."}, {"source": "Gandomi2015", "target": "pilar:geral", "type": "pillars"}, {"source": "Gandomi2015", "target": "FALCO", "type": "contextualiza", "note": "Motivação de contexto (big data corporativo)."}, {"source": "Gasparetto2022", "target": "Minaee2022", "type": "compares_with"}, {"source": "Gasparetto2022", "target": "Kowsari2019", "type": "compares_with"}, {"source": "Gasparetto2022", "target": "pilar:geral", "type": "pillars"}, {"source": "Gasparetto2022", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Gasparetto2022", "target": "FALCO", "type": "contextualiza", "note": "Survey 2022 ponta-a-ponta (texto→predição); redundante com Minaee/Kowsari — manter como citação alternativa apenas."}, {"source": "Gholamian2024", "target": "pilar:P3", "type": "pillars"}, {"source": "Gholamian2024", "target": "dataset:Icecat-370", "type": "datasets"}, {"source": "Gholamian2024", "target": "dataset:WDC-222", "type": "datasets"}, {"source": "Gholamian2024", "target": "tarefa:classificacao-de-produtos", "type": "tasks"}, {"source": "Gholamian2024", "target": "claim-granularidade", "type": "suporta", "note": "Maior espaço fechado da linha LLM-produto que encontramos: 370 folhas (Icecat, 490k treino). LLMs com ICL superam supervisionados sob ABREVIAÇÃO e truncamento — exatamente a degradação do nosso domínio (cupom fiscal). Ancora o claim de que 621 classes excede a literatura."}, {"source": "Gilardi2023", "target": "pilar:P3", "type": "pillars"}, {"source": "Gilardi2023", "target": "metodo:llm-como-oraculo", "type": "uses_methods"}, {"source": "Gilardi2023", "target": "metodo:zero-shot", "type": "uses_methods"}, {"source": "Gilardi2023", "target": "modelo:chatgpt", "type": "models"}, {"source": "Gilardi2023", "target": "tarefa:anotacao-de-texto", "type": "tasks"}, {"source": "Gilardi2023", "target": "FALCO", "type": "fundamenta", "note": "Evidência seminal de que LLMs superam crowd-workers em custo e acurácia de anotação — premissa do oráculo LLM do FALCO. Mas avalia tarefas com poucas classes (relevância/postura/tópicos), não 621 categorias."}, {"source": "Glazkova2020", "target": "pilar:geral", "type": "pillars"}, {"source": "Glazkova2020", "target": "FALCO", "type": "contextualiza", "note": "Enriquecimento por contexto local — contraste que fortalece o argumento do oráculo LLM."}, {"source": "Goudjil2018", "target": "Hoi2006", "type": "compares_with"}, {"source": "Goudjil2018", "target": "Lewis1994", "type": "builds_on"}, {"source": "Goudjil2018", "target": "Hoi2006", "type": "builds_on"}, {"source": "Goudjil2018", "target": "pilar:P2", "type": "pillars"}, {"source": "Goudjil2018", "target": "conceito:selecao-em-lote-por-probabilidade-svm", "type": "proposes"}, {"source": "Goudjil2018", "target": "metodo:svm", "type": "uses_methods"}, {"source": "Goudjil2018", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Goudjil2018", "target": "metodo:selecao-em-lote", "type": "uses_methods"}, {"source": "Goudjil2018", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Goudjil2018", "target": "FALCO", "type": "fundamenta", "note": "Já citado no formalismo do Cap.2 (arcabouço do ciclo de AL). Exemplo canônico de AL+SVM com seleção em LOTE guiada por probabilidades — antecedente direto do QueryBatch por incerteza do FALCO."}, {"source": "Grandini2020", "target": "FALCO", "type": "fundamenta", "note": "É a fonte que descreve as métricas multiclasse alternativas (acurácia balanceada, coeficiente de Matthews, Kappa de Cohen) que a tese cita para, em seguida, dispensar de forma justificada."}, {"source": "Griesshaber2020", "target": "Devlin2019", "type": "builds_on"}, {"source": "Griesshaber2020", "target": "pilar:P1", "type": "pillars"}, {"source": "Griesshaber2020", "target": "pilar:P4", "type": "pillars"}, {"source": "Griesshaber2020", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Griesshaber2020", "target": "metodo:pool-based", "type": "uses_methods"}, {"source": "Griesshaber2020", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "Griesshaber2020", "target": "metodo:bald", "type": "uses_methods"}, {"source": "Griesshaber2020", "target": "metodo:dropout-de-monte-carlo", "type": "uses_methods"}, {"source": "Griesshaber2020", "target": "metodo:aproximacao-bayesiana-de-incerteza", "type": "uses_methods"}, {"source": "Griesshaber2020", "target": "metodo:congelamento-de-camadas", "type": "uses_methods"}, {"source": "Griesshaber2020", "target": "metodo:cnn-como-cabeca-de-classificacao", "type": "uses_methods"}, {"source": "Griesshaber2020", "target": "metodo:selecao-aleatoria", "type": "uses_methods"}, {"source": "Griesshaber2020", "target": "metodo:fine-tuning", "type": "uses_methods"}, {"source": "Griesshaber2020", "target": "modelo:bert-base-uncased", "type": "models"}, {"source": "Griesshaber2020", "target": "dataset:glue", "type": "datasets"}, {"source": "Griesshaber2020", "target": "dataset:mnli", "type": "datasets"}, {"source": "Griesshaber2020", "target": "dataset:qnli", "type": "datasets"}, {"source": "Griesshaber2020", "target": "dataset:snli", "type": "datasets"}, {"source": "Griesshaber2020", "target": "dataset:sst-2", "type": "datasets"}, {"source": "Griesshaber2020", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Griesshaber2020", "target": "tarefa:inferencia-de-linguagem-natural", "type": "tasks"}, {"source": "Griesshaber2020", "target": "FALCO", "type": "fundamenta", "note": "Sexto trabalho da série de regime que venho montando: aprendizado ativo VENCE a seleção aleatória sobre BERT com menos de mil rótulos — mas em tarefas de 2 a 3 classes. Confirma literalmente a frase da L770 da tese ('adaptam AA ao BERT')."}, {"source": "Griesshaber2020", "target": "LCE", "type": "fundamenta", "note": "CORRIGIDO em 2026-08-17, ver a seção 'Correção'. A §5 e a Tab. 3 documentam que a aquisição por incerteza DESEQUILIBRA as classes do treino, de 4 a 10 vezes a seleção aleatória. Eu havia registrado isso como AMEAÇA ao FALCO; o E6 da própria tese mostra o oposto, e o que a evidência combinada sustenta é uma CONDIÇÃO DE CONTORNO: o sinal do efeito depende de o pool ser balanceado (Griesshaber, GLUE, 2-3 classes: afasta do equilíbrio, prejudicial) ou torto (FALCO, natural, 621 classes: puxa para o equilíbrio, é o ganho)."}, {"source": "Griesshaber2020", "target": "DRI-SL", "type": "complementa", "note": "Restringe o pool a um subconjunto de 20 mil elementos por custo computacional, e declara o risco de excluir instâncias relevantes. É precedente publicado para a mesma decisão no FALCO, cujo pool tem 250.221 linhas."}, {"source": "Gunasekara2018", "target": "pilar:geral", "type": "pillars"}, {"source": "Gunasekara2018", "target": "FALCO", "type": "contextualiza", "note": "Periférico (toxicidade multirrótulo)."}, {"source": "Guo2025Deuce", "target": "pilar:P2", "type": "pillars"}, {"source": "Guo2025Deuce", "target": "conceito:dual-neighbor-graph", "type": "proposes"}, {"source": "Guo2025Deuce", "target": "conceito:diversidade-textual+de-classe", "type": "proposes"}, {"source": "Guo2025Deuce", "target": "conceito:propagacao-de-incerteza", "type": "proposes"}, {"source": "Guo2025Deuce", "target": "dataset:IMDb", "type": "datasets"}, {"source": "Guo2025Deuce", "target": "dataset:Yelp", "type": "datasets"}, {"source": "Guo2025Deuce", "target": "dataset:AGNews", "type": "datasets"}, {"source": "Guo2025Deuce", "target": "dataset:Yahoo", "type": "datasets"}, {"source": "Guo2025Deuce", "target": "dataset:DBpedia", "type": "datasets"}, {"source": "Guo2025Deuce", "target": "dataset:TREC", "type": "datasets"}, {"source": "Guo2025Deuce", "target": "DRI-SL", "type": "compete", "note": "Referência mais forte de cold start em classificação textual: combina diversidade TEXTUAL e diversidade de CLASSE PREVISTA num grafo dual, contra o 'missed cluster effect'. Seeds de 32/64/128. O DRI-SL difere: sem PLM, custo linear, novidade LEXICAL explícita, e validado contra envelope evolutivo em 100..5000. A DRI-SL-C (grupos = classes previstas) aproxima-se do espírito class-aware do DEUCE."}, {"source": "Guyon2011ALC", "target": "pilar:geral", "type": "pillars"}, {"source": "Guyon2011ALC", "target": "pilar:P4", "type": "pillars"}, {"source": "Guyon2011ALC", "target": "conceito:ALC", "type": "proposes"}, {"source": "Guyon2011ALC", "target": "conceito:global-score-normalizado", "type": "proposes"}, {"source": "Guyon2011ALC", "target": "metodo:curva-de-aprendizado", "type": "uses_methods"}, {"source": "Guyon2011ALC", "target": "metodo:AUC", "type": "uses_methods"}, {"source": "Guyon2011ALC", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Guyon2011ALC", "target": "dataset:seis-bases-do-desafio-A-F", "type": "datasets"}, {"source": "Guyon2011ALC", "target": "tarefa:classificacao-binaria", "type": "tasks"}, {"source": "Guyon2011ALC", "target": "LCE", "type": "fundamenta", "note": "Conceito-mãe da LCE: a ALC (área sob a curva de aprendizado) é a métrica consagrada pela literatura para resumir uma execução inteira de aprendizado ativo em um único número. A LCE da tese descende dela; o Cap. 2 cita a ALC como o conceito da literatura e a LCE nasce no capítulo de método (padrão de camadas do Cap. 2)."}, {"source": "Guzella2009", "target": "pilar:geral", "type": "pillars"}, {"source": "Guzella2009", "target": "FALCO", "type": "contextualiza", "note": "Aplicação clássica com autoria nacional (UFMG)."}, {"source": "Hacohen2022TypiClust", "target": "Sener2018", "type": "compares_with"}, {"source": "Hacohen2022TypiClust", "target": "Hacohen2019", "type": "builds_on"}, {"source": "Hacohen2022TypiClust", "target": "pilar:P1", "type": "pillars"}, {"source": "Hacohen2022TypiClust", "target": "pilar:P2", "type": "pillars"}, {"source": "Hacohen2022TypiClust", "target": "conceito:typiclust", "type": "proposes"}, {"source": "Hacohen2022TypiClust", "target": "conceito:tipicidade", "type": "proposes"}, {"source": "Hacohen2022TypiClust", "target": "conceito:transicao-de-fase-de-orcamento", "type": "proposes"}, {"source": "Hacohen2022TypiClust", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Hacohen2022TypiClust", "target": "metodo:pool-based", "type": "uses_methods"}, {"source": "Hacohen2022TypiClust", "target": "metodo:cold-start", "type": "uses_methods"}, {"source": "Hacohen2022TypiClust", "target": "metodo:auto-supervisao", "type": "uses_methods"}, {"source": "Hacohen2022TypiClust", "target": "metodo:k-means", "type": "uses_methods"}, {"source": "Hacohen2022TypiClust", "target": "metodo:selecao-por-diversidade", "type": "uses_methods"}, {"source": "Hacohen2022TypiClust", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "Hacohen2022TypiClust", "target": "metodo:entropia", "type": "uses_methods"}, {"source": "Hacohen2022TypiClust", "target": "metodo:menor-margem", "type": "uses_methods"}, {"source": "Hacohen2022TypiClust", "target": "modelo:simclr", "type": "models"}, {"source": "Hacohen2022TypiClust", "target": "modelo:dino", "type": "models"}, {"source": "Hacohen2022TypiClust", "target": "modelo:scan", "type": "models"}, {"source": "Hacohen2022TypiClust", "target": "modelo:flexmatch", "type": "models"}, {"source": "Hacohen2022TypiClust", "target": "modelo:resnet18", "type": "models"}, {"source": "Hacohen2022TypiClust", "target": "dataset:cifar-10", "type": "datasets"}, {"source": "Hacohen2022TypiClust", "target": "dataset:cifar-100", "type": "datasets"}, {"source": "Hacohen2022TypiClust", "target": "dataset:tiny-imagenet", "type": "datasets"}, {"source": "Hacohen2022TypiClust", "target": "dataset:imagenet-subconjuntos", "type": "datasets"}, {"source": "Hacohen2022TypiClust", "target": "tarefa:classificacao-de-imagens", "type": "tasks"}, {"source": "Hacohen2022TypiClust", "target": "DRI-SL", "type": "compara", "note": "Fundamento teórico do regime de orçamento baixo: no cold start, selecionar exemplos TÍPICOS (densos) e diversos vence incerteza e coreset — mesmo princípio de representatividade da etapa 1 do DRI-SL (k-médias + cota proporcional). Diferenças: TypiClust exige representação auto-supervisionada treinada no pool (cara) e mede tipicidade por densidade k-NN, que em texto curto com 7,7% de duplicatas tende a escolher quase-duplicatas; o DRI-SL não usa encoder treinado na tarefa, tem custo linear e adiciona a variedade LEXICAL intragrupo que a tipicidade pura não garante (o próprio paper mostra que tipicidade sem diversidade falha, TPC_NoClust, §4.3.3)."}, {"source": "Hacohen2022TypiClust", "target": "FALCO", "type": "fundamenta", "note": "Dá base teórica (modelo de mistura + transição de fase, §2) para a escolha do FALCO de usar estratégia de representatividade — e não incerteza — na fase de orçamento baixo: até incerteza de oráculo perfeito perde de random nesse regime (§4.3.4)."}, {"source": "Hafez2021", "target": "Paulucio2020", "type": "compares_with"}, {"source": "Hafez2021", "target": "Pawlowski2022", "type": "compares_with"}, {"source": "Hafez2021", "target": "pilar:geral", "type": "pillars"}, {"source": "Hafez2021", "target": "metodo:ranking-probabilistico", "type": "uses_methods"}, {"source": "Hafez2021", "target": "metodo:redes-neurais", "type": "uses_methods"}, {"source": "Hafez2021", "target": "dataset:catalogo-varejo", "type": "datasets"}, {"source": "Hafez2021", "target": "tarefa:classificacao-de-produtos-e-servicos", "type": "tasks"}, {"source": "Hafez2021", "target": "tarefa:classificacao-de-texto-curto", "type": "tasks"}, {"source": "Hafez2021", "target": "FALCO", "type": "contextualiza", "note": "Espectro probabilístico→neural no MESMO problema de varejo: espelha a progressão de classificadores da tese (PVBin probabilístico → BERTimbau neural) em literatura independente."}, {"source": "Hanneke2015", "target": "Cohn1994Improving", "type": "builds_on"}, {"source": "Hanneke2015", "target": "pilar:p1-selecao", "type": "pillars"}, {"source": "Hanneke2015", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Hanneke2015", "target": "metodo:pool-based", "type": "uses_methods"}, {"source": "Hanneke2015", "target": "metodo:aprendizado-baseado-em-desacordo", "type": "uses_methods"}, {"source": "Hanneke2015", "target": "metodo:espaco-de-versao", "type": "uses_methods"}, {"source": "Hanneke2015", "target": "metodo:cal", "type": "uses_methods"}, {"source": "Hanneke2015", "target": "metodo:coeficiente-de-desacordo", "type": "uses_methods"}, {"source": "Hanneke2015", "target": "tarefa:classificacao-binaria", "type": "tasks"}, {"source": "Hanneke2015", "target": "aprendizado-ativo", "type": "fundamenta", "note": "É a fonte teórica da promessa do AA: sob condições explícitas, a complexidade de rótulos cai de O(1/ε) para O(log(1/ε)) — a 'melhoria exponencial' que a Seção 2.1 da tese invoca. Vale como fundamento do que se ESPERA do laço, e como delimitação honesta de quando isso NÃO vale (ver 'o que não sustenta')."}, {"source": "Hanneke2015", "target": "FALCO", "type": "ameaca", "note": "A própria obra registra que a estratégia por desacordo 'às vezes não é ótima' (Cap. 1) e que a dependência logarítmica em 1/ε some sob ruído com α<1 (Cap. 2). Isto é: a promessa teórica do AA é condicional, e as condições não são verificáveis no cenário da tese (714 classes, ruído assimétrico de LLM). É argumento a favor de medir empiricamente, como a tese faz — e contra prometer ganho por autoridade teórica."}, {"source": "He2021", "target": "pilar:geral", "type": "pillars"}, {"source": "He2021", "target": "FALCO", "type": "contextualiza", "note": "AutoML como pano de fundo do P1 (otimizar componentes do pipeline)."}, {"source": "Hoi2006", "target": "Lewis1994", "type": "builds_on"}, {"source": "Hoi2006", "target": "pilar:P2", "type": "pillars"}, {"source": "Hoi2006", "target": "pilar:P4", "type": "pillars"}, {"source": "Hoi2006", "target": "conceito:batch-mode-active-learning", "type": "proposes"}, {"source": "Hoi2006", "target": "conceito:selecao-por-informacao-de-fisher", "type": "proposes"}, {"source": "Hoi2006", "target": "metodo:regressao-logistica", "type": "uses_methods"}, {"source": "Hoi2006", "target": "metodo:otimizacao-convexa", "type": "uses_methods"}, {"source": "Hoi2006", "target": "dataset:tres-colecoes-de-texto", "type": "datasets"}, {"source": "Hoi2006", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Hoi2006", "target": "FALCO", "type": "fundamenta", "note": "Origem do batch-mode AL para texto: selecionar LOTES não-redundantes em vez de 1 instância por iteração. O QueryBatch do FALCO e a preocupação com redundância intra-lote descendem diretamente daqui."}, {"source": "Hu2011", "target": "Lewis1994", "type": "builds_on"}, {"source": "Hu2011", "target": "Settles2012", "type": "builds_on"}, {"source": "Hu2011", "target": "Olsson2009", "type": "builds_on"}, {"source": "Hu2011", "target": "pilar:geral", "type": "pillars"}, {"source": "Hu2011", "target": "pilar:P1", "type": "pillars"}, {"source": "Hu2011", "target": "pilar:P2", "type": "pillars"}, {"source": "Hu2011", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Hu2011", "target": "metodo:selecao-de-seed", "type": "uses_methods"}, {"source": "Hu2011", "target": "metodo:criterio-de-parada", "type": "uses_methods"}, {"source": "Hu2011", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Hu2011", "target": "FALCO", "type": "fundamenta", "note": "Tese de doutorado integral (273 pp.) sobre AL para classificação de texto na era pré-DL: precedente estrutural de uma TESE organizada em torno do ciclo completo de AL textual (seed, seleção, parada) — o mesmo esqueleto que o FALCO instancia com oráculo LLM."}, {"source": "Ikonomakis2005", "target": "pilar:geral", "type": "pillars"}, {"source": "Ikonomakis2005", "target": "FALCO", "type": "contextualiza", "note": "Identidade corrigida no saneamento; review histórico do pipeline."}, {"source": "Jacomassi2024", "target": "Ren2021", "type": "compares_with"}, {"source": "Jacomassi2024", "target": "Ren2021", "type": "builds_on"}, {"source": "Jacomassi2024", "target": "pilar:geral", "type": "pillars"}, {"source": "Jacomassi2024", "target": "pilar:P2", "type": "pillars"}, {"source": "Jacomassi2024", "target": "metodo:deep-active-learning", "type": "uses_methods"}, {"source": "Jacomassi2024", "target": "tarefa:classificacao", "type": "tasks"}, {"source": "Jacomassi2024", "target": "FALCO", "type": "contextualiza", "note": "Investigação nacional RECENTE (IME-USP, 2024) de deep AL: mostra que o tema está ativo no Brasil em paralelo à tese — e que nenhum trabalho nacional cobre oráculo LLM para texto curto em português (nossa lacuna)."}, {"source": "James2021", "target": "pilar:geral", "type": "pillars"}, {"source": "James2021", "target": "FALCO", "type": "contextualiza", "note": "Livro-texto guarda-chuva para fundamentos estatísticos."}, {"source": "Javed2018", "target": "Bard2019Normalizador", "type": "compares_with"}, {"source": "Javed2018", "target": "pilar:geral", "type": "pillars"}, {"source": "Javed2018", "target": "conceito:normalizacao-de-texto-informal", "type": "proposes"}, {"source": "Javed2018", "target": "metodo:normalizacao-lexical", "type": "uses_methods"}, {"source": "Javed2018", "target": "dataset:microblogs", "type": "datasets"}, {"source": "Javed2018", "target": "tarefa:analise-de-sentimento", "type": "tasks"}, {"source": "Javed2018", "target": "tarefa:normalizacao", "type": "tasks"}, {"source": "Javed2018", "target": "FALCO", "type": "contextualiza", "note": "Normalização de texto informal como etapa prévia: paralela ao nosso problema de abreviações de varejo (CERV→cerveja). No FALCO essa normalização é DELEGADA ao LLM (expanded_description) em vez de a um módulo dedicado. (Arquivo veio rotulado como Han 2011; identidade corrigida no saneamento.)"}, {"source": "Jiang2021Multiview", "target": "pilar:geral", "type": "pillars"}, {"source": "Jiang2021Multiview", "target": "FALCO", "type": "contextualiza", "note": "Periférico; candidato a poda."}, {"source": "Jindal2015", "target": "pilar:geral", "type": "pillars"}, {"source": "Jindal2015", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Jindal2015", "target": "FALCO", "type": "contextualiza", "note": "Review pré-embeddings herdado do draft; utilidade apenas histórica."}, {"source": "Joachims1996", "target": "Salton1988", "type": "extends"}, {"source": "Joachims1996", "target": "Salton1988", "type": "builds_on"}, {"source": "Joachims1996", "target": "pilar:geral", "type": "pillars"}, {"source": "Joachims1996", "target": "conceito:probtfidf", "type": "proposes"}, {"source": "Joachims1996", "target": "conceito:analise-probabilistica-do-rocchio", "type": "proposes"}, {"source": "Joachims1996", "target": "metodo:rocchio", "type": "uses_methods"}, {"source": "Joachims1996", "target": "metodo:tfidf", "type": "uses_methods"}, {"source": "Joachims1996", "target": "metodo:naive-bayes", "type": "uses_methods"}, {"source": "Joachims1996", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Joachims1996", "target": "FALCO", "type": "fundamenta", "note": "Explicação probabilística do TF-IDF/Rocchio: o ancestral formal da família de classificadores por protótipo — a MESMA família dos métodos argmax de Darú (2022/2024) e do PVBin. Dá profundidade teórica à linhagem do nosso baseline."}, {"source": "Joachims1998", "target": "Salton1988", "type": "builds_on"}, {"source": "Joachims1998", "target": "pilar:geral", "type": "pillars"}, {"source": "Joachims1998", "target": "conceito:svm-para-texto", "type": "proposes"}, {"source": "Joachims1998", "target": "metodo:svm", "type": "uses_methods"}, {"source": "Joachims1998", "target": "dataset:reuters", "type": "datasets"}, {"source": "Joachims1998", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Joachims1998", "target": "FALCO", "type": "fundamenta", "note": "O artigo que explica POR QUE texto favorece classificadores de margem: alta dimensão com muitos atributos relevantes e vetores esparsos. Fundamenta a discussão de propriedades do espaço textual no Cap.2."}, {"source": "KahlootEkler2021", "target": "pilar:geral", "type": "pillars"}, {"source": "KahlootEkler2021", "target": "FALCO", "type": "contextualiza", "note": "Particionamento como decisão explícita — eco da nossa exigência de dedupe antes do split."}, {"source": "Karl2023", "target": "Devlin2019", "type": "compares_with"}, {"source": "Karl2023", "target": "pilar:geral", "type": "pillars"}, {"source": "Karl2023", "target": "pilar:P4", "type": "pillars"}, {"source": "Karl2023", "target": "conceito:benchmark-stops", "type": "proposes"}, {"source": "Karl2023", "target": "conceito:benchmark-nice", "type": "proposes"}, {"source": "Karl2023", "target": "metodo:transformer", "type": "uses_methods"}, {"source": "Karl2023", "target": "metodo:bert", "type": "uses_methods"}, {"source": "Karl2023", "target": "metodo:gnn", "type": "uses_methods"}, {"source": "Karl2023", "target": "metodo:cnn-rnn", "type": "uses_methods"}, {"source": "Karl2023", "target": "modelo:bert", "type": "models"}, {"source": "Karl2023", "target": "dataset:nice", "type": "datasets"}, {"source": "Karl2023", "target": "dataset:stops", "type": "datasets"}, {"source": "Karl2023", "target": "dataset:benchmarks-stc", "type": "datasets"}, {"source": "Karl2023", "target": "tarefa:classificacao-de-texto-curto", "type": "tasks"}, {"source": "Karl2023", "target": "tarefa:classificacao-de-produtos-e-servicos", "type": "tasks"}, {"source": "Karl2023", "target": "FALCO", "type": "fundamenta", "note": "Evidência de que transformers puros são SOTA em texto curto — valida a escolha do BERTimbau como classificador-alvo. E o caso de uso (classificar descrições de produtos/serviços, dataset STOPS de descrições da Amazon) é o mais próximo do nosso na literatura fichada."}, {"source": "Kavitha2021Review", "target": "pilar:geral", "type": "pillars"}, {"source": "Kavitha2021Review", "target": "FALCO", "type": "contextualiza", "note": "Metadados incompletos; candidato a poda."}, {"source": "Kesiku2022", "target": "pilar:geral", "type": "pillars"}, {"source": "Kesiku2022", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Kesiku2022", "target": "FALCO", "type": "contextualiza", "note": "Uso pontual: domínio biomédico como exemplo de rotulagem cara por especialista."}, {"source": "Kholodna2024", "target": "Rouzegar2024Thesis", "type": "compares_with"}, {"source": "Kholodna2024", "target": "pilar:P3", "type": "pillars"}, {"source": "Kholodna2024", "target": "conceito:selecao-de-anotador-llm", "type": "proposes"}, {"source": "Kholodna2024", "target": "conceito:anotacao-em-lote", "type": "proposes"}, {"source": "Kholodna2024", "target": "metodo:llm-como-oraculo", "type": "uses_methods"}, {"source": "Kholodna2024", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "Kholodna2024", "target": "modelo:gpt-4-turbo", "type": "models"}, {"source": "Kholodna2024", "target": "modelo:afroxlmr-mini", "type": "models"}, {"source": "Kholodna2024", "target": "dataset:MasakhaNER-2.0", "type": "datasets"}, {"source": "Kholodna2024", "target": "RQ2-lote", "type": "suporta", "note": "Precedente direto da anotação em LOTE no laço de AL com LLM: mostra a amortização do prompt como componente central da economia (>=42x vs humano). Também mede 'output format correctness' — antecipa nosso achado de que erro de formato != erro semântico (taxa de inválidos)."}, {"source": "Kohavi1995", "target": "FALCO", "type": "fundamenta", "note": "Protocolo de estimação de acurácia e seleção de modelo: validação cruzada estratificada como prática padrão, essencial sob desbalanceamento — condição do nosso espaço de 621 rótulos."}, {"source": "Kossen2021ActiveTesting", "target": "Farquhar2021Bias", "type": "extends"}, {"source": "Kossen2021ActiveTesting", "target": "Farquhar2021Bias", "type": "builds_on"}, {"source": "Kossen2021ActiveTesting", "target": "Houlsby2011", "type": "builds_on"}, {"source": "Kossen2021ActiveTesting", "target": "pilar:P4", "type": "pillars"}, {"source": "Kossen2021ActiveTesting", "target": "conceito:teste-ativo", "type": "proposes"}, {"source": "Kossen2021ActiveTesting", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Kossen2021ActiveTesting", "target": "metodo:pool-based", "type": "uses_methods"}, {"source": "Kossen2021ActiveTesting", "target": "metodo:entropia", "type": "uses_methods"}, {"source": "Kossen2021ActiveTesting", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "Kossen2021ActiveTesting", "target": "metodo:estimador-lure", "type": "uses_methods"}, {"source": "Kossen2021ActiveTesting", "target": "modelo:rede-neural-bayesiana", "type": "models"}, {"source": "Kossen2021ActiveTesting", "target": "modelo:resnet", "type": "models"}, {"source": "Kossen2021ActiveTesting", "target": "modelo:wideresnet", "type": "models"}, {"source": "Kossen2021ActiveTesting", "target": "modelo:processo-gaussiano", "type": "models"}, {"source": "Kossen2021ActiveTesting", "target": "modelo:random-forest", "type": "models"}, {"source": "Kossen2021ActiveTesting", "target": "dataset:mnist", "type": "datasets"}, {"source": "Kossen2021ActiveTesting", "target": "dataset:fashion-mnist", "type": "datasets"}, {"source": "Kossen2021ActiveTesting", "target": "dataset:cifar-10", "type": "datasets"}, {"source": "Kossen2021ActiveTesting", "target": "dataset:cifar-100", "type": "datasets"}, {"source": "Kossen2021ActiveTesting", "target": "tarefa:classificacao-de-imagens", "type": "tasks"}, {"source": "Kossen2021ActiveTesting", "target": "tarefa:regressao", "type": "tasks"}, {"source": "Kossen2021ActiveTesting", "target": "FALCO", "type": "fundamenta", "note": "Segunda citação obrigatória do parecer R6 item 10 [Dom-M3]. Estabelece que rotular o conjunto de TESTE também é caro e que o viés de seleção 'is far more harmful for testing than it is for training' — a justificativa de literatura para o instrumento interna vs. externa do E6 e para o conjunto reservado que o FALCO exige. A tese cita o fenômeno e o framework daqui; reivindica a quantificação no seu cenário, não a descoberta."}, {"source": "Kossen2021ActiveTesting", "target": "FALCO", "type": "ameaca", "note": "Mostra que avaliar um modelo em pontos adquiridos por incerteza SUPERESTIMA a perda de teste (subestima o desempenho), pior em modelos sobreconfiantes — exatamente o risco do teste interno do laço FALCO se usado para decidir parada/liberação. Também e ssão SEQUENCIAL por fases com gate de custo, espaço de 621 classes, instrumentação de medição."}, {"source": "Raczkowska2024AlleNoise", "target": "Merdjanovska2024NoiseBench", "type": "compares_with"}, {"source": "Raczkowska2024AlleNoise", "target": "pilar:P4", "type": "pillars"}, {"source": "Raczkowska2024AlleNoise", "target": "conceito:benchmark-ruido-real", "type": "proposes"}, {"source": "Raczkowska2024AlleNoise", "target": "dataset:AlleNoise", "type": "datasets"}, {"source": "Raczkowska2024AlleNoise", "target": "tarefa:classificacao-de-produtos", "type": "tasks"}, {"source": "Raczkowska2024AlleNoise", "target": "E4", "type": "suporta", "note": "502.310 títulos CURTOS de produtos, 5.692 categorias, 15% de ruído REAL instance-dependent de marketplace com rótulos limpos verificados. Mostra que métodos de learning-with-noisy-labels que funcionam com ruído sintético falham no real — nuance incorporada à leitura do E4. É o benchmark de réplica ideal para o FALCO (Cap. 6, futuros)."}, {"source": "Raschka2018", "target": "pilar:geral", "type": "pillars"}, {"source": "Raschka2018", "target": "FALCO", "type": "contextualiza", "note": "Tutorial de referência para o protocolo de avaliação; cobre McNemar que usamos no E0."}, {"source": "Ren2021", "target": "Settles2012", "type": "extends"}, {"source": "Ren2021", "target": "Settles2012", "type": "builds_on"}, {"source": "Ren2021", "target": "pilar:geral", "type": "pillars"}, {"source": "Ren2021", "target": "pilar:P4", "type": "pillars"}, {"source": "Ren2021", "target": "conceito:taxonomia-deepal", "type": "proposes"}, {"source": "Ren2021", "target": "metodo:deep-active-learning", "type": "uses_methods"}, {"source": "Ren2021", "target": "tarefa:visao-computacional", "type": "tasks"}, {"source": "Ren2021", "target": "tarefa:pln", "type": "tasks"}, {"source": "Ren2021", "target": "FALCO", "type": "fundamenta", "note": "Ponte AL clássico → deep learning: fundamenta o uso de AL com classificadores profundos (BERTimbau no E2/E3) e hroder2022Uncertainty", "target": "modelo:kimcnn", "type": "models"}, {"source": "Schroder2022Uncertainty", "target": "dataset:agnews", "type": "datasets"}, {"source": "Schroder2022Uncertainty", "target": "dataset:trec", "type": "datasets"}, {"source": "Schroder2022Uncertainty", "target": "dataset:movie-reviews", "type": "datasets"}, {"source": "Schroder2022Uncertainty", "target": "dataset:customer-reviews", "type": "datasets"}, {"source": "Schroder2022Uncertainty", "target": "dataset:subjectivity", "type": "datasets"}, {"source": "Schroder2022Uncertainty", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Schroder2022Uncertainty", "target": "FALCO", "type": "fundamenta", "note": "Valida empiricamente a escolha central do FALCO: com transformers, estratégias de incerteza (baratas) são eficazes E eficientes, enquanto as estratégias 'estado-da-arte' impõem overhead proibitivo no laço — mesmo argumento de custo que justifica nosso classificador leve no laço e BERTimbau fora dele (E3')."}, {"source": "Schroder2022Uncertainty", "target": "FALCO", "type": "ameaca", "note": "Desafia o status da entropia (PE) como baseline default: com transformers, breaking ties (menor-margem) supera PE em média nos multiclasse. Como nosso baseline de incerteza é entropia num problema de 714 classes, precisamos ou justificar a escolha ou reportar BT — citar ao definir os baselines do P4."}, {"source": "Schroder2022Uncertainty", "target": "LCE", "type": "complementa", "note": "Usa AUC da curva de aprendizado como métrica-resumo de eficiência — antecedente direto da LCE; citar como prática corrente que a LCE refina."}, {"source": "ScottMatwin1999", "target": "pilar:geral", "type": "pillars"}, {"source": "ScottMatwin1999", "target": "FALCO", "type": "contextualiza", "note": "Elo de 1999 da linha de enriquecimento que culmina no nosso expanded_description."}, {"source": "Sener2018", "target": "Gal2017", "type": "compares_with"}, {"source": "Sener2018", "target": "pilar:P2", "type": "pillars"}, {"source": "Sener2018", "target": "conceito:core-set-selection", "type": "proposes"}, {"source": "Sener2018", "target": "conceito:k-center-greedy", "type": "proposes"}, {"source": "Sener2018", "target": "conceito:robust-k-center", "type": "proposes"}, {"source": "Sener2018", "target": "metodo:aprendizado-ativo", "type": "uses_methods"}, {"source": "Sener2018", "target": "metodo:pool-based", "type": "uses_methods"}, {"source": "Sener2018", "target": "metodo:rotulagem-em-lote", "type": "uses_methods"}, {"source": "Sener2018", "target": "metodo:selecao-por-diversidade", "type": "uses_methods"}, {"source": "Sener2018", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "Sener2018", "target": "metodo:entropia", "type": "uses_methods"}, {"source": "Sener2018", "target": "modelo:vgg-16", "type": "models"}, {"source": "Sener2018", "target": "dataset:cifar-10", "type": "datasets"}, {"source": "Sener2018", "target": "dataset:cifar-100", "type": "datasets"}, {"source": "Sener2018", "target": "dataset:svhn", "type": "datasets"}, {"source": "Sener2018", "target": "tarefa:classificacao-de-imagens", "type": "tasks"}, {"source": "Sener2018", "target": "DRI-SL", "type": "compara", "note": "Clássico da seleção por diversidade geométrica: AL em lote como cobertura minimax (k-Center) no espaço de ativações do próprio modelo. Três diferenças que o confronto do Cap. 2 explora: (i) coreset NÃO é cold start — a distância usa ativações de uma rede já treinada no pool inicial rotulado, enquanto o DRI-SL parte de rótulo zero; (ii) o próprio bound dos autores escala com o número de classes (pior com muitas classes — nós temos 714); (iii) cobertura minimax privilegia pontos extremos/outliers, frágil em texto curto esparso e ruidoso, enquanto o DRI-SL aloca por densidade proporcional + novidade lexical. Em orçamento baixo, coreset empata com random (Hacohen2022TypiClust, Fig. 4) e fica abaixo até de random em cold start textual (Yu2023Patron, Tab. 1)."}, {"source": "Settles2009", "target": "Settles2012", "type": "compares_with"}, {"source": "Settles2009", "target": "Angluin1988", "type": "builds_on"}, {"source": "Settles2009", "target": "Cohn1994Improving", "type": "builds_on"}, {"source": "Settles2009", "target": "Lewis1994", "type": "builds_on"}, {"source": "Settles2009", "target": "pilar:geral", "type": "pillars"}, {"source": "Settles2009", "target": "FALCO", "type": "fundamenta", "note": "O survey mais citado da história do AL (TR 1648, 2009) — versão técnica anterior ao livro de 2012 (já fichado). Manter para citações que referenciam especificamente o TR."}, {"source": "Settles2012", "target": "Angluin1988", "type": "builds_on"}, {"source": "Settles2012", "target": "Cohn1994Improving", "type": "builds_on"}, {"source": "Settles2012", "target": "Lewis1994", "type": "builds_on"}, {"source": "Settles2012", "target": "pilar:geral", "type": "pillars"}, {"source": "Settles2012", "target": "pilar:P2", "type": "pillars"}, {"source": "Settles2012", "target": "conceito:taxonomia-de-cenarios-de-al", "type": "proposes"}, {"source": "Settles2012", "target": "conceito:frameworks-de-selecao-de-consulta", "type": "proposes"}, {"source": "Settles2012", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "Settles2012", "target": "metodo:query-by-committee", "type": "uses_methods"}, {"source": "Settles2012", "target": "metodo:densidade", "type": "uses_methods"}, {"source": "Settles2012", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Settles2012", "target": "FALCO", "type": "fundamenta", "note": "Referência canônica de AL: define o laço consulta→oráculo→treino e os frameworks de seleção que o FALCO combina por fase. É a fonte da terminologia (pool-based, uncertainty sampling) usada em toda a tese."}, {"source": "SettlesCravenFriedland2008", "target": "Settles2012", "type": "extends"}, {"source": "SettlesCravenFriedland2008", "target": "pilar:P3", "type": "pillars" "Sharma2015", "target": "FALCO", "type": "fundamenta", "note": "O oráculo devolve MAIS que o rótulo: racionais (trechos justificativos) incorporáveis ao treino. Precedente humano direto do nosso campo rationale/expanded_description no JSON do oráculo LLM."}, {"source": "Shen2018", "target": "Lewis1994", "type": "builds_on"}, {"source": "Shen2018", "target": "pilar:P2", "type": "pillars"}, {"source": "Shen2018", "target": "conceito:mnlp-normalizacao-de-incerteza", "type": "proposes"}, {"source": "Shen2018", "target": "metodo:deep-active-learning", "type": "uses_methods"}, {"source": "Shen2018", "target": "metodo:amostragem-por-incerteza", "type": "uses_methods"}, {"source": "Shen2018", "target": "dataset:conll", "type": "datasets"}, {"source": "Shen2018", "target": "dataset:ontonotes", "type": "datasets"}, {"source": "Shen2018", "target": "tarefa:ner", "type": "tasks"}, {"source": "Shen2018", "target": "FALCO", "type": "fundamenta", "note": "Demonstração canônica de que deep AL reduz drasticamente os rótulos em PLN (NER): frequentemente citada como prova de viabilidade do AL com redes profundas — apoio quantitativo à premissa da tese."}, {"source": "Sheng2008", "target": "pilar:p3-oraculo", "type": "pillars"}, {"source": "Sheng2008", "target": "conceito:rotulagem-repetida", "type": "proposes"}, {"source": "Sheng2008", "target": "conceito:selective-repeated-labeling", "type": "proposes"}, {"source": "Sheng2008", "target": "oraculo-imperfeito", "type": "fundamenta", "note": "Formaliza QUANDO vale a pena pagar por rótulos repetidos de anotadores ruidosos em vez de rotular itens novos: depende da qualidade do anotador e do custo relativo. A rotulagem repetida seletiva (nos itens de rótulo mais incerto) domina as demais políticas. Citado na Seção 2.2.3; o dilema qualidade×custo do rótulo é exatamente o eixo que o FALCO transforma em decisão de cardápio de oráculos LLM (fase Inicial × Avançada)."}, {"source": "Silva2020", "target": "pilar:geral", "type": "pillars"}, {"source": "Silva2020", "target": "conceito:corpus-fakebr", "type": "proposes"}, {"source": "Silva2020", "target": "metodo:classificadores-classicos", "type": "uses_methods"}, {"source": "Silva2020", "target": "metodo:avaliacao-comparativa", "type": "uses_methods"}, {"source": "Silva2020", "target": "dataset:fake-br-corpus", "type": "datasets"}, {"source": "Silva2020", "target": "tarefa:classificacao-de-texto", "type": "tasks"}, {"source": "Silva2020", "target": "tarefa:deteccao-de-fake-news", "type": "tasks"}, {"source": "Silva2020", "target": "FALCO", "type": "contextualiza", "note": "Classificação de texto EM PORTUGUÊS com construção de corpus (UFSCar/ NILC-USP): exemplo de referência nacional de pipeline completo corpus→classificação — espelho do par dataset (Daru2022) + tese."}, {"source": "Snow2008", "target": "pilar:p3-oraculo", "type": "pillars"}, {"source": "Snow2008", "target": "conceito:avaliacao-de-anotadores-nao-especialistas", "type": "proposes"}, {"source": "Snow2008", "target": "conceito:correcao-por-vies-do-anotador", "type": "proposes"}, {"source": "Snow2008", "target": "oraculo-imperfeito", "type": "fundamenta", "note": "Trabalho seminal da linha 'anotador barato e imperfeito': mede a qualidade de anotadores de crowdsourcing (AMT) em 5 tarefas de PLN contra especialistas, mostra que poucas anotações não-especialistas agregadas igualam o especialista, e propõe correção de viés por anotador. É o antecessor conceitual direto do LLM-como-oráculo: citado na Seção 2.2.3 (limitações do laço clássico, suposição de oráculo perfeito)."}, {"source": "Sokolova2009", "target": "pilar:geral", "type": "pillars"}, {"source": "Sokolova2009", "target": "conceito:analise-de-invariancia-de-metricas", "type": "proposes"}, {"source": "Sokolova2009", "target": "metodo:analise-sistematica", "type": "uses_methods"}, {"source": "Sokolova2009", "target": "tarefa:avaliacao-de-classificadores", "type": "tasks"}, {"source": "Sokolova2009", "target": "FALCO", "type": "fundamenta", "note": "A referência das métricas usadas na tese (já citada na seção de avaliação do Cap.2): analisa 24 medidas em binário/multiclasse/ multirrótulo/hierárquico via propriedades de invariância."}, {"source": "Song2014", "target": "pilar:geral", "type": "pillars"}, {"source": "Song2014", "target": "conceito:caracterizacao-de-texto-curto", "type": "proposes"}, {"source": "Song2014", "target": "metodo:analise-semantica", "type": "uses_methods"}, {"source": "Song2014", "target": "metodo:semi-supervisao", "type": "uses_methods"}, {"source": "Song2014", "target": "metodo:ensemble", "type": "uses_methods"}, {"source": "Song2014", "target": "tarefa:classificacao-de-texto-curto", "type": "tasks"}, {"source": "Song2014", "target": "FALCO", "type": "fundamenta", "note": "Define as quatro dificuldades canônicas do texto curto (esparsidade, larga escala, imediatismo, não-padronização) — a caracterização do nosso objeto de estudo (descrições de produto ~20–40 caracteres)."}, {"source": "Song2022GraphSSL", "target": "pilar:geral", "type": "pillars"}, {"source": "Song2022GraphSSL", "target": "FALCO", "type": "contextualiza", "note": "Par moderno do Liu2012; uso opcional."}, {"source": "Song2023NoisyLabels", "target": "Frenay2014", "type": "builds_on"}, {"source": "Song2023NoisyLabels", "target": "Natarajan2013", "type": "builds_on"}, {"source": "Song2023NoisyLabels", "target": "pilar:P2", "type": "pillars"}, {"source": "Song2023NoisyLabels", "target": "pilar:P3", "type": "pillars"}, {"source": "Song2023NoisyLabels", "target": "metodo:ruido-simetrico", "type": "uses_methods"}, {"source": "Song2023NoisyLabels", "target": "metodo:ruido-assimetrico", "type": "uses_methods"}, {"source": "Song2023NoisyLabels", "target": "metodo:ruido-de-par", "type": "uses_methods"}, {"source": "Song2023NoisyLabels", "target": "metodo:ruido-dependente-da-instancia", "type": "uses_methods"}, {"source": "Song2023NoisyLabels", "target": "metodo:matriz-de-transicao-de-ruido", "type": "uses_methods"}, {"source": "Song2023NoisyLabels", "target": "metodo:efeito-de-memorizacao", "type": "uses_methods"}, {"source": "Song2023NoisyLabels", "target": "metodo:small-loss-trick", "type": "uses_methods"}, {"source": "Song2023NoisyLabels", "target": "metodo:selecao-de-amostras", "type": "uses_methods"}, {"source": "Song2023NoisyLabels", "target": "metodo:correcao-de-perda", "type": "uses_methods"}, {"source": "Song2023NoisyLabels", "target": "metodo:co-teaching", "type": "uses_methods"}, {"source": "Song2023NoisyLabels", "target": "metodo:aprendizado-multi-rodada", "type": "uses_methods"}, {"source": "Song2023NoisyLabels", "target": "modelo:wideresnet", "type": "models"}, {"source": "Song2023NoisyLabels", "target": "dataset:cifar-10", "type": "datasets"}, {"source": "Song2023NoisyLabels", "target": "dataset:cifar-100", "type": "datasets"}, {"source": "Song2023NoisyLabels", "target": "dataset:mnist", "type": "datasets"}, {"source": "Song2023NoisyLabels", "target": "dataset:fashion-mnist", "type": "datasets"}, {"source": "Song2023NoisyLabels", "target": "dataset:svhn", "type": "datasets"}, {"source": "Song2023NoisyLabels", "target": "dataset:tiny-imagenet", "type": "datasets"}, {"source": "Song2023NoisyLabels", "target": "dataset:imagenet", "type": "datasets"}, {"source": "Song2023NoisyLabels", "target": "dataset:clothing1m", "type": "datasets"}, {"source": "Song2023NoisyLabels", "target": "dataset:animal-10n", "type": "datasets"}, {"source": "Song2023NoisyLabels", "target": "dataset:food-101n", "type": "datasets"}, {"source": "Song2023NoisyLabels", "target": "dataset:webvision", "type": "datasets"}, {"source": "Song2023NoisyLabels", "target": "dataset:cifar-10n", "type": "datasets"}, {"source": "Song2023NoisyLabels", "target": "dataset:cifar-100n", "type": "datasets"}, {"source": "Song2023NoisyLabels", "target": "tarefa:classificacao-de-imagens", "type": "tasks"}, {"source": "Song2023NoisyLabels", "target": "DRI-SL", "type": "fundamenta", "note": "Dá o vocabulário formal para descrever o ruído do oráculo LLM: a matriz de transição T com Tij = p(ỹ=j|y=i) separa ruído SIMÉTRICO (uniforme entre classes) de ASSIMÉTRICO ou dependente de rótulo (a classe verdadeira tende a ser trocada por uma classe específica — o exemplo do survey é 'cachorro' confundido com 'gato' e não com 'peixe'), e ambos de ruído DEPENDENTE DA INSTÂNCIA. O ruído observado no FALCO — confusões concentradas em pares de classes semanticamente vizinhas — é assimétrico nessa taxonomia."}, {"source": "Song2023NoisyLabels", "target": "FALCO", "type": "ameaca", "note": "ATENÇÃO — a tese cita este survey em 5-resultados-falco/texto.tex:143 para sustentar que ruído estruturado é 'cenário MENOS DANOSO ao classificador treinado que ruído uniforme'. O survey NÃO sustenta isso e, na dimensão que ele efetivamente mede, afirma o CONTRÁRIO: sob ruído assimétrico as distribuições de perda dos exemplos corretos e incorretos se sobrepõem, o desempenho dos métodos robustos 'piora consideravelmente' e identificar exemplos limpos fica MAIS difícil (§VII-A, p. 14; §III-E Remark, p. 9; Figuras 5 e 7, ambas a 40% de ruído no CIFAR-100). Detalhe na seção 'Contradição com o Cap. 5' abaixo."}, {"source": "Souza2020BERTimbau", "target": "Devlin2019", "type": "extends"}, {"source": "Souza2020BERTimbau", "target": "Devlin2019", "type": "builds_on"}, {"source": "Souza2020BERTimbau", "target": "pilar:P4", "type": "pillars"}, {"source": "Souza2020BERTimbau", "target": "conceito:bertimbau", "type": "proposes"}, {"source": "Souza2020BERTimbau", "target": "metodo:pre-treinamento", "type": "uses_methods"}, {"source": "Souza2020BERTimbau", "target": "metodo:fine-tuning", "type": "uses_methods"}, {"source": "Souza2020BERTimbau", "target": "modelo:bertimbau", "type": "models"}, {"source": "Souza2020BERTimbau", "target": "modelo:bert", "type": "models"}, {"source": "Souza2020BERTimbau", "target": "modelo:mbert", "type": "models"}, {"source": "Souza2020BERTimbau", "target": "dataset:brwac", "type": "datasets"}, {"source"
