<meta charset="utf-8">
<title>Knowledge Graph — Tese FALCO</title>
<style>
  :root {
    --bg: #f7f6f2; --panel: #fffdf8; --ink: #23252b; --muted: #6b6f78;
    --line: #e3e0d8; --edge: rgba(60, 64, 72, 0.28); --edge-falco: rgba(160, 58, 82, 0.5);
    --artigo: #35629e; --pendente: #9aa7bd; --framework: #a03a52; --pilar: #b0713a;
    --metodo: #4a8a63; --conceito: #7a6aa0; --modelo: #737d8c; --dataset: #737d8c;
    --tarefa: #737d8c; --halo: rgba(53, 98, 158, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151922; --panel: #1c212c; --ink: #e6e4dc; --muted: #98a0ad;
      --line: #2a3040; --edge: rgba(200, 205, 214, 0.22); --edge-falco: rgba(224, 122, 148, 0.55);
      --artigo: #6f9bd4; --pendente: #5d6b83; --framework: #d4708c; --pilar: #cf9a62;
      --metodo: #74b58d; --conceito: #a894cf; --modelo: #8d99ac; --dataset: #8d99ac;
      --tarefa: #8d99ac; --halo: rgba(111, 155, 212, 0.2);
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f6f2; --panel: #fffdf8; --ink: #23252b; --muted: #6b6f78;
    --line: #e3e0d8; --edge: rgba(60, 64, 72, 0.28); --edge-falco: rgba(160, 58, 82, 0.5);
    --artigo: #35629e; --pendente: #9aa7bd; --framework: #a03a52; --pilar: #b0713a;
    --metodo: #4a8a63; --conceito: #7a6aa0; --modelo: #737d8c; --dataset: #737d8c;
    --tarefa: #737d8c; --halo: rgba(53, 98, 158, 0.16);
  }
  :root[data-theme="dark"] {
    --bg: #151922; --panel: #1c212c; --ink: #e6e4dc; --muted: #98a0ad;
    --line: #2a3040; --edge: rgba(200, 205, 214, 0.22); --edge-falco: rgba(224, 122, 148, 0.55);
    --artigo: #6f9bd4; --pendente: #5d6b83; --framework: #d4708c; --pilar: #cf9a62;
    --metodo: #74b58d; --conceito: #a894cf; --modelo: #8d99ac; --dataset: #8d99ac;
    --tarefa: #8d99ac; --halo: rgba(111, 155, 212, 0.2);
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #wrap { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 1.25rem;
    padding: 0.7rem 1.1rem; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 {
    margin: 0; font: 600 1.05rem/1.2 Georgia, "Times New Roman", serif;
    letter-spacing: 0.01em;
  }
  header .sub { color: var(--muted); font-size: 0.8rem; }
  #filters { display: flex; flex-wrap: wrap; gap: 0.25rem 0.9rem; margin-left: auto; }
  #filters label {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-size: 0.78rem; color: var(--muted); cursor: pointer; user-select: none;
  }
  #filters input { accent-color: var(--artigo); }
  .swatch { width: 0.65rem; height: 0.65rem; border-radius: 50%; display: inline-block; }
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #detail {
    position: absolute; top: 0.9rem; right: 0.9rem; width: min(340px, 85vw);
    max-height: calc(100% - 2rem); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 0.9rem 1rem; box-shadow: 0 6px 24px rgba(0,0,0,0.12); display: none;
  }
  #detail.open { display: block; }
  #detail h2 { margin: 0 0 0.2rem; font: 600 1rem/1.3 Georgia, serif; text-wrap: balance; }
  #detail .kind {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted);
  }
  #detail .meta { color: var(--muted); font-size: 0.8rem; margin: 0.3rem 0 0.6rem; }
  #detail ul { margin: 0.3rem 0 0; padding-left: 1.1rem; font-size: 0.82rem; }
  #detail li { margin-bottom: 0.35rem; }
  #detail .rel { font-weight: 600; }
  #detail .note { color: var(--muted); }
  #detail button {
    position: absolute; top: 0.5rem; right: 0.6rem; border: 0; background: none;
    color: var(--muted); font-size: 1rem; cursor: pointer;
  }
  #detail button:focus-visible, #filters input:focus-visible { outline: 2px solid var(--artigo); outline-offset: 2px; }
  #hint {
    position: absolute; left: 1rem; bottom: 0.8rem; color: var(--muted);
    font-size: 0.72rem; pointer-events: none;
  }
</style>
<div id="wrap">
  <header>
    <h1>Knowledge Graph — Tese FALCO</h1>
    <span class="sub" id="stats"></span>
    <div id="filters"></div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <aside id="detail" aria-live="polite">
      <button id="close" aria-label="Fechar painel">×</button>
      <div id="detail-body"></div>
    </aside>
    <div id="hint">arraste nós · roda do mouse = zoom · clique = detalhes · fundo = pan</div>
  </div>
</div>
<script>
const GRAPH = /*__GRAPH_JSON__*/;

const TYPE_LABEL = {
  "artigo": "Artigos fichados", "artigo-pendente": "A fichar", "framework": "FALCO",
  "pilar": "Pilares", "metodo": "Métodos", "conceito": "Conceitos propostos",
  "modelo": "Modelos", "dataset": "Datasets", "tarefa": "Tarefas"
};
const TYPE_VAR = {
  "artigo": "--artigo", "artigo-pendente": "--pendente", "framework": "--framework",
  "pilar": "--pilar", "metodo": "--metodo", "conceito": "--conceito",
  "modelo": "--modelo", "dataset": "--dataset", "tarefa": "--tarefa"
};
const RADIUS = { "framework": 16, "artigo": 9, "artigo-pendente": 6, "pilar": 11 };
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const nodes = GRAPH.nodes.map(n => ({ ...n,
  x: Math.random() * 800 - 400, y: Math.random() * 600 - 300, vx: 0, vy: 0,
  r: RADIUS[n.type] || 7 }));
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
const edges = GRAPH.edges.filter(e => byId[e.source] && byId[e.target])
  .map(e => ({ ...e, s: byId[e.source], t: byId[e.target] }));
const degree = {};
edges.forEach(e => { degree[e.source] = (degree[e.source]||0)+1; degree[e.target] = (degree[e.target]||0)+1; });
nodes.forEach(n => { if (n.type === "artigo") n.r = 8 + Math.min(6, (degree[n.id]||0) * 0.35); });

const visible = {}; Object.keys(TYPE_LABEL).forEach(t => visible[t] = true);
["modelo","dataset","tarefa"].forEach(t => visible[t] = false); // começa focado

const filters = document.getElementById("filters");
const present = new Set(nodes.map(n => n.type));
for (const t of Object.keys(TYPE_LABEL)) {
  if (!present.has(t)) continue;
  const label = document.createElement("label");
  const cb = Object.assign(document.createElement("input"), { type: "checkbox", checked: visible[t] });
  cb.addEventListener("change", () => { visible[t] = cb.checked; });
  const sw = document.createElement("span"); sw.className = "swatch";
  sw.style.background = css(TYPE_VAR[t]);
  label.append(cb, sw, TYPE_LABEL[t]);
  filters.append(label);
}
document.getElementById("stats").textContent =
  `${nodes.filter(n=>n.type==="artigo").length} artigos · ${edges.length} relações`;

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W, H, DPR = Math.min(2, window.devicePixelRatio || 1);
let scale = 1, ox = 0, oy = 0;
function resize() {
  const rect = cv.parentElement.getBoundingClientRect();
  W = rect.width; H = rect.height;
  cv.width = W * DPR; cv.height = H * DPR;
  ox = ox || W / 2; oy = oy || H / 2;
}
window.addEventListener("resize", resize); resize();

function isVisible(n) { return visible[n.type]; }

function step() {
  const vs = nodes.filter(isVisible);
  for (const n of vs) { n.vx *= 0.85; n.vy *= 0.85; }
  for (let i = 0; i < vs.length; i++) for (let j = i + 1; j < vs.length; j++) {
    const a = vs[i], b = vs[j];
    let dx = b.x - a.x, dy = b.y - a.y, d2 = dx*dx + dy*dy || 1;
    if (d2 < 90000) {
      const f = 1400 / d2, d = Math.sqrt(d2);
      dx /= d; dy /= d;
      a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
    }
  }
  for (const e of edges) {
    if (!isVisible(e.s) || !isVisible(e.t)) continue;
    let dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1, want = e.t.type === "framework" || e.s.type === "framework" ? 190 : 120;
    const f = (d - want) * 0.004; dx /= d; dy /= d;
    e.s.vx += dx * f * d * 0.02; e.s.vy += dy * f * d * 0.02;
    e.t.vx -= dx * f * d * 0.02; e.t.vy -= dy * f * d * 0.02;
  }
  for (const n of vs) {
    n.vx -= n.x * 0.0012; n.vy -= n.y * 0.0012; // gravidade ao centro
    if (n !== dragNode) { n.x += n.vx; n.y += n.vy; }
  }
}

let selected = null, hover = null;
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.translate(ox, oy); ctx.scale(scale, scale);
  const edgeCol = css("--edge"), falcoCol = css("--edge-falco");
  for (const e of edges) {
    if (!isVisible(e.s) || !isVisible(e.t)) continue;
    const toFalco = e.t.type === "framework";
    ctx.strokeStyle = toFalco ? falcoCol : edgeCol;
    ctx.lineWidth = (selected && (e.s === selected || e.t === selected)) ? 2.2 : (toFalco ? 1.4 : 0.8);
    ctx.beginPath(); ctx.moveTo(e.s.x, e.s.y); ctx.lineTo(e.t.x, e.t.y); ctx.stroke();
  }
  for (const n of nodes) {
    if (!isVisible(n)) continue;
    const col = css(TYPE_VAR[n.type] || "--muted");
    if (n === selected || n === hover) {
      ctx.fillStyle = css("--halo");
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 8, 0, 7); ctx.fill();
    }
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.fill();
    if (n.type === "artigo-pendente") {
      ctx.strokeStyle = css("--bg"); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r - 2, 0, 7); ctx.stroke();
    }
    if (scale > 0.55 || n.r >= 11 || n === selected || n === hover) {
      ctx.fillStyle = css("--ink");
      ctx.font = `${n.type === "framework" ? "700 13px Georgia, serif" : "11px system-ui"}`;
      ctx.textAlign = "center";
      ctx.fillText(n.label, n.x, n.y - n.r - 5);
    }
  }
}

let raf;
function loop() { step(); draw(); raf = requestAnimationFrame(loop); }
loop();

function pick(mx, my) {
  const x = (mx - ox) / scale, y = (my - oy) / scale;
  let best = null, bestD = 1e9;
  for (const n of nodes) {
    if (!isVisible(n)) continue;
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < n.r + 6 && d < bestD) { best = n; bestD = d; }
  }
  return best;
}

let dragNode = null, panning = false, px = 0, py = 0, moved = false;
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId); moved = false;
  const n = pick(e.offsetX, e.offsetY);
  if (n) { dragNode = n; cv.classList.add("dragging"); }
  else { panning = true; px = e.offsetX; py = e.offsetY; }
});
cv.addEventListener("pointermove", e => {
  if (dragNode) {
    moved = true;
    dragNode.x = (e.offsetX - ox) / scale; dragNode.y = (e.offsetY - oy) / scale;
    dragNode.vx = dragNode.vy = 0;
  } else if (panning) {
    moved = true; ox += e.offsetX - px; oy += e.offsetY - py; px = e.offsetX; py = e.offsetY;
  } else hover = pick(e.offsetX, e.offsetY);
});
cv.addEventListener("pointerup", e => {
  if (!moved) {
    const n = pick(e.offsetX, e.offsetY);
    selected = n; showDetail(n);
  }
  dragNode = null; panning = false; cv.classList.remove("dragging");
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.12 : 0.89, ns = Math.min(4, Math.max(0.25, scale * k));
  ox = e.offsetX - (e.offsetX - ox) * (ns / scale);
  oy = e.offsetY - (e.offsetY - oy) * (ns / scale);
  scale = ns;
}, { passive: false });

const detail = document.getElementById("detail"), body = document.getElementById("detail-body");
document.getElementById("close").addEventListener("click", () => { detail.classList.remove("open"); selected = null; });
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function showDetail(n) {
  if (!n) { detail.classList.remove("open"); return; }
  const rels = edges.filter(e => e.s === n || e.t === n).map(e => {
    const other = e.s === n ? e.t : e.s;
    const dir = e.s === n ? "→" : "←";
    const note = e.note ? `<div class="note">${esc(e.note)}</div>` : "";
    return `<li><span class="rel">${esc(e.type)}</span> ${dir} ${esc(other.label)}${note}</li>`;
  }).join("");
  body.innerHTML = `
    <div class="kind">${esc(TYPE_LABEL[n.type] || n.type)}</div>
    <h2>${esc(n.title || n.label)}</h2>
    <div class="meta">${[n.year, n.venue, n.paper_type].filter(Boolean).map(esc).join(" · ")}</div>
    <ul>${rels || "<li class='note'>sem relações visíveis</li>"}</ul>`;
  detail.classList.add("open");
}
</script>
