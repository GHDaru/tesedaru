name: Painel da tese
# Publica as 5 páginas do site da tese (Controle, Plano, Coordenação,
# Resultados, Referências) no GitHub Pages a cada push que as toque. O HTML
# nasce inteiro do scripts/render-plano-revisao.py no momento do deploy — a
# página online está sempre igual aos JSONs de docs/records/ da main, sem
# passo manual.
on:
  push:
    branches: [main]
    paths:
      - docs/records/plano-revisao.json
      - docs/records/resultados.json
      - scripts/render-plano-revisao.py
      - scripts/compute-kpis.py
      - scripts/compute-mensagens.py
      - scripts/compute-referencias.py
      - coordenacao/**
      - .github/workflows/painel.yml
      # página Referências: bib + capítulos (ordem de citação) + fichamentos
      - referencias.bib
      - principal.tex
      - "1-intro/texto.tex"
      - "2-fundam/texto.tex"
      - "3-metodo/texto.tex"
      - "4-resultados-l0/texto.tex"
      - "5-resultados-falco/texto.tex"
      - "6-conclusao/texto.tex"
      - "a1-lce/texto.tex"
      - "a2-ag/texto.tex"
      - "a3-drisl/texto.tex"
      - "a4-biblioteca/texto.tex"
      - "a5-prompts/texto.tex"
      - "a6-tabelas/texto.tex"
      - "a7-parada-drift/texto.tex"
      - "fichamentos/**"
      - "referencias-pdf/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: a série de evolução vem do git log do plano
      - name: Instala dependências (PyYAML — parsing de front-matter dos fichamentos)
        run: pip install --quiet pyyaml
      - name: Computa KPIs e renderiza as 5 páginas do site
        run: |
          mkdir -p _site
          python3 scripts/compute-kpis.py
          python3 scripts/compute-mensagens.py
          python3 scripts/compute-referencias.py
          python3 scripts/render-plano-revisao.py _site
          cp docs/records/plano-revisao.json docs/records/kpis.json docs/records/mensagens.json _site/
          test -f docs/records/resultados.json && cp docs/records/resultados.json _site/ || true
          test -f docs/records/referencias.json && cp docs/records/referencias.json _site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

# Pages habilitado pelo autor em 2026-08-16; este commit re-dispara o deploy inicial.
